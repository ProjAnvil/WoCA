# woca-enterprise gateway — the single distribution point between the edge
# segment and the data segments (pg / mq). TCP pass-through only: the
# data-plane protocols are PostgreSQL wire and NATS, both of which must
# reach the backend unmodified (TLS terminates at the clients/servers).
#
# Mounted as the container's main /etc/nginx/nginx.conf (the stream block
# cannot live in conf.d/, which the default main config includes inside
# http{}). The listen ports here are fixed high ports; the host-side
# mapping (and any override) is owned by the compose ports section.

worker_processes auto;
error_log /dev/stderr notice;

events {
    worker_connections 4096;
}

stream {
    # PostgreSQL write path: the primary (single writer).
    upstream pg_write {
        server pg-primary:5432;
    }

    # PostgreSQL read path: the hot-standby replica.
    upstream pg_read {
        server pg-replica:5432;
    }

    # NATS client path: any cluster member can serve a connection; the
    # servers exchange gossip, so a client landing on any node sees the
    # whole grid.
    upstream nats_client {
        least_conn;
        server nats-js-1:4222;
        server nats-js-2:4222;
        server nats-js-3:4222;
    }

    # NATS monitoring (varz/jsz/healthz) — served by node 1.
    upstream nats_monitor {
        server nats-js-1:8222;
    }

    server {
        listen 35432;
        proxy_pass pg_write;
        proxy_connect_timeout 5s;
    }
    server {
        listen 35433;
        proxy_pass pg_read;
        proxy_connect_timeout 5s;
    }
    server {
        listen 34222;
        proxy_pass nats_client;
        proxy_connect_timeout 5s;
    }
    server {
        listen 38222;
        proxy_pass nats_monitor;
        proxy_connect_timeout 5s;
    }
}
