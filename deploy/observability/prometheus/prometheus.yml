# Prometheus scrape configuration for the woca enterprise compose stack
# (design §12.3: the IT operations pane is Prometheus + Grafana, not a
# homegrown console). Targets are the compose service names; in Kubernetes
# replace the static_configs with kubernetes_sd_configs (see
# deploy/k8s/README.md).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/woca-rules.yaml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # woca-server instances expose /metrics on the business port (8080).
  # DNS service discovery over the role alias (every server container
  # carries it on the woca-infra network), so scaling the role adds targets
  # without touching this file; in Kubernetes replace with
  # kubernetes_sd_configs (see deploy/k8s/README.md).
  - job_name: woca-server
    dns_sd_configs:
      - names: ["woca-server"]
        type: A
        port: 8080
        refresh_interval: 15s

  # woca-worker instances expose /healthz + /metrics on the probe port.
  # DNS-SD over the role alias on woca-infra, same discipline as the
  # woca-server job above.
  - job_name: woca-worker
    dns_sd_configs:
      - names: ["woca-worker"]
        type: A
        port: 9092
        refresh_interval: 15s

  # The collector re-exports OTLP metrics (including GenAI spans-derived
  # series with service_name labels) and its own pipeline health.
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]

  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]
