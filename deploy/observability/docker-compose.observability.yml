# woca-enterprise observability stack (design §12.3, Phase 4 IT console).
#
# Overlay onto the full deployment; same compose project, so service names
# resolve and lifecycle is shared:
#
#   docker compose -f deploy/selfhosted/docker-compose.full.yml \
#                  -f deploy/observability/docker-compose.observability.yml up -d
#
# NOTE: keep docker-compose.full.yml FIRST — compose resolves relative
# volume paths against the first file's directory, which is why the mounts
# below say ../observability/...
#
# Adds: OTel Collector (the observability pipeline: Prometheus/Jaeger out),
# Prometheus (+alert rules), Alertmanager, Grafana (provisioned dashboard
# "woca Services"), Jaeger (trace search). Host entry for Grafana is the
# gateway :8085.
#
# Role instrumentation no longer rides this overlay: the roles push OTLP
# unconditionally to the woca-collector trace bridge (docker-compose.full.yml,
# infra zone, addressed through the nacos entry woca-obs.otlp), and that
# bridge fans traces/metrics out to this stack's collector when the overlay
# is up — the overlay only provides the pipeline itself.
#
# §12.2 config separation: everything here is infrastructure config (env +
# files under deploy/observability/); tenant/business configuration stays in
# tenant-svc and must never move into this layer.
name: woca-enterprise-full

services:
  gateway:
    ports:
      - "${ENT_GRAFANA_PORT:-8085}:8085"
    networks:
      - woca-dmz
      - woca-infra
      - woca-mgmt

  # The roles need no overlay changes anymore: telemetry export and the
  # mgmt-side path to the woca-collector bridge are part of the base stack
  # (docker-compose.full.yml); these network mappings only re-declare the
  # base segments so the overlay stays self-describing.

  # ─────────────────── Observability pipeline ───────────────────
  otel-collector:
    image: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib:0.136.0
    container_name: woca-ent-otelcol
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ../observability/otelcol/config.yaml:/etc/otelcol/config.yaml:ro
    networks: [woca-infra]

  jaeger:
    image: jaegertracing/all-in-one:1.65.0
    container_name: woca-ent-jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    networks: [woca-infra]

  prometheus:
    image: prom/prometheus:v3.4.1
    container_name: woca-ent-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    volumes:
      - ../observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../observability/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    networks: [woca-infra]

  alertmanager:
    image: prom/alertmanager:v0.28.1
    container_name: woca-ent-alertmanager
    volumes:
      - ../observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    networks: [woca-infra]

  grafana:
    image: grafana/grafana:11.6.0
    container_name: woca-ent-grafana
    environment:
      # Internal ops console behind the gateway; harden before exposing
      # wider (design §12.3 keeps the IT pane ops-facing, not tenant-facing).
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ../observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../observability/grafana/provisioning/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    networks: [woca-infra]

networks:
  # The pipeline rides the infra zone (docker-compose.full.yml) — the
  # former dedicated obs segment folded in, Terraform parity.
  woca-infra:
    name: woca-ent-infra
    ipam:
      config: [{ subnet: 172.28.20.0/24 }]

volumes:
  prometheus-data:
    name: woca-ent-obs-prometheus
  grafana-data:
    name: woca-ent-obs-grafana
