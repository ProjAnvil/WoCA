# OTel Collector for the woca enterprise observability stack (design
# §12.3). Fed by the woca-collector trace bridge (deploy/collector/), which
# the roles push to over the management segment — this collector only sees
# traffic when the overlay is up (the bridge fails fast and drops
# otherwise).
#
# Receives OTLP/HTTP from every server artifact (woca-scheduler on its business
# port, woca-worker over the same push), exports:
#   - metrics -> Prometheus exposition at :8889 (scraped by Prometheus)
#   - traces  -> Jaeger (Tempo is a drop-in replacement via the otlphttp
#                endpoint); LLM traces additionally fan out to Langfuse at
#                the bridge, not here
#   - logs    -> not wired yet; Loki/Tempo arrive with the log pipeline.
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 5s

exporters:
  prometheus:
    endpoint: 0.0.0.0:8889
    resource_to_telemetry_conversion:
      enabled: true # service_name becomes a label for per-instance panels
  otlphttp/jaeger:
    endpoint: http://jaeger:4318
  debug:
    verbosity: basic

service:
  telemetry:
    metrics:
      level: basic
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/jaeger, debug]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus]
