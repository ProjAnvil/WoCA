# Dev deployment gateway: the minimal twin of nginx-full.conf — a single
# woca-scheduler upstream, no Grafana/observability block. Same port layout
# as full (:8080 business, :8082 skills, :8083 discovery,
# :8086 config console), so dev and full are drop-in replacements for the
# host.

upstream woca_schedulers {
    server woca-scheduler-1:8080;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;  # business entry (host :8080)
    location = /metrics { return 404; }
    location / {
        proxy_pass http://woca_schedulers;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_buffering off;          # SSE
        proxy_read_timeout 3600s;     # long runs
        proxy_send_timeout 3600s;
    }
}

# Skill-asset console (design §6.4): the SPA is the woca-ops facade's
# /skillsvc/ surface; its API (/api/skills) is the console-gated management
# route on woca-scheduler, reached through the facade's /api channel.
upstream woca_ops {
    server ops:8091;
}
server {
    listen 8082;  # skill-asset console
    location / {
        proxy_pass http://woca_ops/skillsvc/;
        proxy_set_header Host $host;
    }
    # The SPA's absolute asset URLs (vite base /skillsvc/) and API calls.
    location /skillsvc/ {
        proxy_pass http://woca_ops;
        proxy_set_header Host $host;
    }
    location /api/skills {
        proxy_pass http://woca_ops;
        proxy_set_header Host $host;
    }
}

server {
    listen 8083;  # component discovery & configuration
    location /health {
        proxy_pass http://woca_schedulers/api/health;
    }
    location /woca/status {
        proxy_pass http://woca_schedulers/api/stats;
    }
    location /ladym/health {
        proxy_pass http://ladym-api:8080/api/stats;
    }
    location /ladym/stats {
        proxy_pass http://ladym-api:8080/api/stats;
    }
}

# Config console (design §16): same admin entry as full.
upstream woca_config {
    server woca-config:8080;
}
server {
    listen 8086;  # config console (host :8086)
    location = /metrics { return 404; }
    location / {
        proxy_pass http://woca_config;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
