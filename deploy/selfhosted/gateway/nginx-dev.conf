# Dev deployment gateway: the minimal twin of nginx-full.conf — a single
# woca-server upstream, no Grafana/observability block. Same port layout
# as full (:8080 business, :8082 skills, :8083 discovery,
# :8086 config console), so dev and full are drop-in replacements for the
# host.

upstream woca_servers {
    server woca-server-1:8080;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;  # business entry (host :8080)
    location = /metrics { return 404; }
    location / {
        proxy_pass http://woca_servers;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_buffering off;          # SSE
        proxy_read_timeout 3600s;     # long runs
        proxy_send_timeout 3600s;
    }
}

server {
    listen 8082;  # skill-svc management SPA
    location / {
        proxy_pass http://woca_servers/skills/;
        proxy_set_header Host $host;
    }
    location /api/skills/ {
        proxy_pass http://woca_servers/api/skills/;
        proxy_set_header Host $host;
    }
}

server {
    listen 8083;  # component discovery & configuration
    location /health {
        proxy_pass http://woca_servers/api/health;
    }
    location /woca/status {
        proxy_pass http://woca_servers/api/stats;
    }
    location /ladym/health {
        proxy_pass http://ladym-api:8080/api/stats;
    }
    location /ladym/stats {
        proxy_pass http://ladym-api:8080/api/stats;
    }
}

# Config console (design §16): same admin entry as full.
upstream woca_config {
    server woca-config:8080;
}
server {
    listen 8086;  # config console (host :8086)
    location = /metrics { return 404; }
    location / {
        proxy_pass http://woca_config;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
