# Full deployment gateway (design §5.3): the only container publishing
# host ports; routes to the three exposed management surfaces and
# load-balances the business entry across woca-server instances.

# Business entry: round-robin across woca-server instances.
# NOTE: nginx resolves these names once at config load. Recreating the
# woca-server containers changes their IPs — restart the gateway after app
# container recreation (`make ent-obs-up` does this for you).
upstream woca_servers {
    least_conn;
    server woca-server-1:8080;
    server woca-server-2:8080;
}

# SSE-friendly settings for all proxied locations
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;  # business entry (host :8080)
    # /metrics stays internal: Prometheus scrapes it on the container
    # network. The public entry must not expose per-route series.
    location = /metrics { return 404; }
    location / {
        proxy_pass http://woca_servers;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_buffering off;          # SSE
        proxy_read_timeout 3600s;     # long runs
        proxy_send_timeout 3600s;
    }
}

server {
    listen 8082;  # skill-svc management SPA
    location / {
        # woca-server serves the embedded skillsvc SPA at /skills/
        proxy_pass http://woca_servers/skills/;
        proxy_set_header Host $host;
    }
    location /api/skills/ {
        proxy_pass http://woca_servers/api/skills/;
        proxy_set_header Host $host;
    }
}

server {
    listen 8083;  # component discovery & configuration
    location /health {
        proxy_pass http://woca_servers/api/health;
    }
    location /woca/status {
        proxy_pass http://woca_servers/api/stats;
    }
    location /ladym/health {
        proxy_pass http://ladym-api-1:8080/api/stats;
    }
    location /ladym/stats {
        proxy_pass http://ladym-api-1:8080/api/stats;
    }
}

# Grafana ops console (design §12.3): the IT pane, embedded into the woca
# SPA as a link. Upstream resolves on the woca-infra zone; add the
# observability overlay before exposing :8085.
upstream grafana_console {
    server grafana:3000;
}
server {
    listen 8085;  # Grafana (host :8085, observability overlay only)
    location / {
        proxy_pass http://grafana_console;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;   # Grafana live panels
        proxy_set_header Connection $connection_upgrade;
    }
}

# Langfuse ops UI (LLM tracing, host :3000): reverse-proxied to the infra
# zone — ops reach the tracing UI through the same DMZ entry as every
# other console; the roles reach Langfuse only through the
# woca-collector bridge. NEXTAUTH sign-in callbacks need the externally
# visible origin (LANGFUSE_NEXTAUTH_URL=http://<host>:3000).
upstream langfuse_web {
    server langfuse-web:3000;
}
server {
    listen 3000;
    location = /metrics { return 404; }
    location / {
        proxy_pass http://langfuse_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }
}

# Config console (design §16): the standalone settings management plane —
# ops entry for configuration read/write and export/import. Authenticate
# with a local-tenant admin API key (woca-tenant tenant issue local
# --role admin).
upstream woca_config {
    server woca-config:8080;
}
server {
    listen 8086;  # config console (host :8086)
    location = /metrics { return 404; }
    location / {
        proxy_pass http://woca_config;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
