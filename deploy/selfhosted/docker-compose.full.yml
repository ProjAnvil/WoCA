# woca-enterprise: full microservices deployment (design §4/§5.3/§6.3)
#
# Zone-first network model, kept 1:1 with the Terraform reference
# (deploy/terraform/aws — five zones: dmz / app / data / infra / mgmt).
# Every zone is one compose network; dual-homed services carry one
# interface per zone; the firewall one-shot drops cross-zone forwarding
# (everything legal stays intra-zone on a shared leg); the only host
# entry is the gateway.
#
#   dmz  172.28.30.0/24   gateway (nginx) — the public half of the edge
#   app  172.28.32.0/24   woca-server ×2, woca-worker ×2, woca-tenant
#   data 172.28.10.0/24   woca-pg-primary + hot-standby
#   infra 172.28.20.0/24  the platform substrate: NATS ×3, ladyM, nacos,
#                         woca-collector (trace bridge) + Langfuse (LLM
#                         tracing) — the former obs/mq/ladym segments
#                         folded in, exactly like the Terraform mapping
#   mgmt 172.28.50.0/24   the consoles only (woca-config, woca-ops)
#
# Two rulings carried over from the Terraform side:
#   - dmz/app split: the business roles never share a segment with the
#     public gateway; the only dmz→app flows are the gateway's proxy
#     targets (:8080/:8090).
#   - nacos rides infra (not mgmt): nacosrt is a hard startup gate for
#     every role — runtime infrastructure, not a management surface — so
#     an mgmt outage never blocks role restarts/scale-outs.
#
# Roles (§5.1 artifact matrix):
#   - woca-server  ×2  L1+L2 modular-monolith role (auth, routing, sessions,
#                      skill-svc; also executes in-process runs)
#   - woca-worker  ×2  L3 execution role (claims queued runs; probe port 9092)
#   - woca-tenant  ×1  admin toolbox (`docker exec` for tenant/key commands)
#   - gateway      ×1  nginx: TLS-less edge proxy, the only published ports
#                      (incl. :3000 = the Langfuse ops UI, reverse-proxied
#                      to infra)
#
# Database physical isolation (§6.3.3): woca-pg (OLTP) ≠ ladym-pg (pgvector),
# independent fault domains, no cross-database joins.
#
# Lifecycle: `make ent-full-up` / `make ent-full-down` (firewall rules are
# installed by the one-shot `firewall` service and removed on down).

name: woca-enterprise-full

services:
  # ─────────────────────── PostgreSQL (zone: data) ────────────────────────
  woca-pg-primary:
    image: postgres:16-alpine
    container_name: woca-ent-pg-primary
    environment:
      POSTGRES_USER: woca
      POSTGRES_PASSWORD: ${WOCA_PG_PASSWORD:?set in .env}
      POSTGRES_DB: woca
      WOCA_PG_REPL_PASSWORD: ${WOCA_PG_REPL_PASSWORD:?set in .env}
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - max_wal_senders=16
      - -c
      - max_replication_slots=16
      - -c
      - listen_addresses=*
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U woca -d woca"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    volumes:
      - woca-pg-primary-data:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    networks:
      - woca-data

  # Hot-standby replica: the shared init script base-backs-up an empty
  # PGDATA (slot woca_replica) and hands off to the stock entrypoint as the
  # unprivileged postgres user; populated PGDATA degrades to a plain start.
  woca-pg-replica:
    image: postgres:16-alpine
    container_name: woca-ent-pg-replica
    depends_on:
      woca-pg-primary: { condition: service_healthy }
    environment:
      WOCA_PG_PRIMARY_HOST: woca-pg-primary
      WOCA_PG_REPL_PASSWORD: ${WOCA_PG_REPL_PASSWORD}
    entrypoint: /usr/local/bin/init-replica.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U woca"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    volumes:
      - woca-pg-replica-data:/var/lib/postgresql/data
      - ./pg/init-replica.sh:/usr/local/bin/init-replica.sh:ro
    networks:
      - woca-data

  # ─────────────────────── NATS JetStream (zone: infra) ────────────────────
  # Client port 4222, cluster port 6222, monitoring 8222 (healthcheck).
  nats-js-1: &nats
    image: nats:2.11-alpine
    container_name: woca-ent-nats-1
    command:
      - nats-server
      - -js
      - --name
      - nats-js-1
      - --cluster_name
      - WOCA_ENT
      - --cluster
      - nats://0.0.0.0:6222
      - --routes
      - nats://nats-js-1:6222,nats://nats-js-2:6222,nats://nats-js-3:6222
      - --http_port
      - "8222"
      - --store_dir
      - /data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8222/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    volumes:
      - nats-js-1-data:/data
    networks:
      - woca-infra

  nats-js-2:
    <<: *nats
    container_name: woca-ent-nats-2
    command:
      - nats-server
      - -js
      - --name
      - nats-js-2
      - --cluster_name
      - WOCA_ENT
      - --cluster
      - nats://0.0.0.0:6222
      - --routes
      - nats://nats-js-1:6222,nats://nats-js-2:6222,nats://nats-js-3:6222
      - --http_port
      - "8222"
      - --store_dir
      - /data
    volumes:
      - nats-js-2-data:/data

  nats-js-3:
    <<: *nats
    container_name: woca-ent-nats-3
    command:
      - nats-server
      - -js
      - --name
      - nats-js-3
      - --cluster_name
      - WOCA_ENT
      - --cluster
      - nats://0.0.0.0:6222
      - --routes
      - nats://nats-js-1:6222,nats://nats-js-2:6222,nats://nats-js-3:6222
      - --http_port
      - "8222"
      - --store_dir
      - /data
    volumes:
      - nats-js-3-data:/data

  # One-shot: provisions the platform streams (run queue work-queue
  # retention + event fanout limits retention, design §5.4/§10).
  # Idempotent — existing streams are left untouched.
  nats-init:
    image: synadia/nats-box:latest
    container_name: woca-ent-nats-init
    depends_on:
      nats-js-1: { condition: service_healthy }
      nats-js-2: { condition: service_started }
      nats-js-3: { condition: service_started }
    environment:
      NATS_URL: nats://nats-js-1:4222
    entrypoint:
      - /bin/sh
      - -ec
      - |
        nats stream info WOCA_RUNS >/dev/null 2>&1 || \
        nats stream create WOCA_RUNS \
          --subjects 'runs.>' \
          --storage file --retention work --replicas 3 --discard new \
          --max-msgs=-1 --max-msg-size=-1 \
          --dupe-window 2m --max-age 168h --max-bytes 2147483648
        nats stream info WOCA_EVENTS >/dev/null 2>&1 || \
        nats stream create WOCA_EVENTS \
          --subjects 'events.>' \
          --storage file --retention limits --replicas 3 --discard old \
          --max-msgs=-1 --max-msg-size=-1 \
          --dupe-window 2m --max-age 24h --max-bytes 5368709120
        echo "woca-enterprise JetStream streams ready"
    restart: "no"
    networks:
      - woca-infra

  # ─────────────── woca-collector: the trace bridge ────────────────────────
  # The single ingestion point for role telemetry (deploy/collector/): the
  # roles push credential-less OTLP over their existing mgmt leg (the
  # nacos entry woca-obs.otlp below points here), this bridge owns the
  # Langfuse path + Basic auth and fans traces out to langfuse-web and the
  # obs overlay's collector (Jaeger/Prometheus; dropped when the overlay
  # is off). Dual-homed mgmt+obs: receive on mgmt, export on obs — no
  # cross-segment forwarding, the DOCKER-USER isolation rules keep
  # applying to everyone else.
  woca-collector:
    image: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib:0.136.0
    container_name: woca-ent-collector
    command: ["--config=/etc/otelcol/config.yaml"]
    environment:
      # "Basic " + base64 of the bootstrap project key pair; matches the
      # LANGFUSE_INIT_PROJECT_*_KEY defaults (see langfuse-web below).
      LANGFUSE_OTLP_AUTH: ${LANGFUSE_OTLP_AUTH:-Basic cGstbGYtd29jYS1sb2NhbDpzay1sZi13b2NhLWxvY2Fs}
    volumes:
      - ../collector/config-full.yaml:/etc/otelcol/config.yaml:ro
    restart: unless-stopped
    networks:
      - woca-infra

  # ─────────────── cross-segment isolation (DOCKER-USER) ──────────────────
  # Recent Docker networking stacks no longer isolate inter-network traffic
  # themselves; this one-shot installs DROP rules for every forwarded packet
  # between the deployment's segments. Legitimate flows never cross at the
  # IP layer — every dual-homed service (gateway, woca roles) reaches a peer
  # over the segment they share. `make ent-full-down` removes the rules.
  # ─────────────────── nacos: discovery + address delivery ───────────────
  # The deployment-layer registry (design §12.1): the woca roles resolve
  # their service addresses (DB DSN, the ops facade's server upstream)
  # from nacos config entries at assembly time — the roles never hardcode
  # peer addresses in this stack. This is deployment-level address
  # delivery only; business settings still belong to the config plane
  # (woca-config, the settings-generation watcher — §16).
  nacos:
    image: nacos/nacos-server:v2.4.3
    container_name: woca-ent-nacos
    environment:
      MODE: standalone
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8848/nacos/v1/console/health/readiness || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s
    restart: unless-stopped
    networks:
      - woca-infra

  # One-shot: publish the stack's service addresses as config entries.
  # Re-running is idempotent (same values republished). Entries:
  #   DEFAULT_GROUP/woca-db.dsn       — the shared settings database
  #   DEFAULT_GROUP/woca-ops.upstream — woca-server's management listener
  nacos-init:
    image: curlimages/curl:8.10.1
    container_name: woca-ent-nacos-init
    depends_on:
      nacos: { condition: service_healthy }
    environment:
      WOCA_PG_PASSWORD: ${WOCA_PG_PASSWORD:?set in .env}
    entrypoint:
      - /bin/sh
      - -ec
      - |
        publish() {  # dataId content
          curl -sf -X POST "http://nacos:8848/nacos/v1/cs/configs" \
            --data-urlencode "dataId=$$1" \
            --data-urlencode "group=DEFAULT_GROUP" \
            --data-urlencode "content=$$2"
          # A fresh nacos write is briefly invisible to reads (derby
          # settling); read back until the entry serves its content, so
          # service_completed_successfully means the roles can resolve.
          i=0
          until [ "$$(curl -sf "http://nacos:8848/nacos/v1/cs/configs?dataId=$$1&group=DEFAULT_GROUP")" = "$$2" ]; do
            i=$$((i+1)); [ $$i -gt 30 ] && { echo "nacos read-back of $$1 never settled"; exit 1; }
            sleep 1
          done
          echo "published $$1"
        }
        publish woca-db.dsn "postgres://woca:$${WOCA_PG_PASSWORD}@woca-pg-primary:5432/woca?sslmode=disable"
        publish woca-ops.upstream "http://woca-server-1:8090"
        # The trace bridge every role pushes telemetry at (resolved from
        # WOCA_OTEL_EXPORTER_OTLP_ENDPOINT like a WOCA_DB reference).
        publish woca-obs.otlp "http://woca-collector:4318"
        # The edge access point's plane legs (registry/auth on the service
        # plane, config pulls, obs forward target) — same discovery
        # discipline as every role.
        publish woca-edge.service "http://woca-server-1:8090"
        publish woca-edge.config "http://woca-config:8086"
        # The empty bootstrap config pack: roles refuse to start without
        # a deliverable pack, so it exists before any console write.
        publish woca-config.pack '{"version":1,"generation":"","settings":{}}'
        echo "nacos service addresses ready"
    restart: "no"
    networks:
      - woca-infra

  firewall:
    image: alpine:3.22
    container_name: woca-ent-firewall
    pid: host
    privileged: true
    restart: "no"
    command:
      - nsenter
      - -t
      - "1"
      - -m
      - -n
      - --
      - sh
      - -c
      - |
        set -e
        iptables -N WOCA-ENT-ISOLATION 2>/dev/null || true
        iptables -F WOCA-ENT-ISOLATION
        # Five zones, every pair dropped both ways (the Terraform NACL
        # matrix translated to DOCKER-USER): dmz 172.28.30, app 172.28.32,
        # data 172.28.10, infra 172.28.20, mgmt 172.28.50. Legitimate
        # flows never cross at the IP layer — dual-homed services reach
        # peers over the zone they share.
        ZONES="172.28.30.0/24 172.28.32.0/24 172.28.10.0/24 172.28.20.0/24 172.28.50.0/24"
        for src in $$ZONES; do
          for dst in $$ZONES; do
            if [ "$$src" != "$$dst" ]; then
              iptables -A WOCA-ENT-ISOLATION -s $$src -d $$dst -j DROP
            fi
          done
        done
        iptables -A WOCA-ENT-ISOLATION -j RETURN
        iptables -C DOCKER-USER -j WOCA-ENT-ISOLATION 2>/dev/null || \
          iptables -I DOCKER-USER 1 -j WOCA-ENT-ISOLATION
        echo "woca-enterprise: inter-segment isolation installed"
        iptables -S DOCKER-USER | head -3

  # ─────────────────────────── gateway (L1, edge) ──────────────────────────
  # The edge access point: the stateless public entry — client tunnels,
  # the machine channel (registry, config pulls, model catalog, auth
  # forwarding), and the /gw/obs telemetry push for enrolled bridges.
  # Plain HTTP is the compose-stack posture; production terminates TLS on
  # the DMZ node (deploy/terraform/aws).
  woca-edge:
    image: woca-edge:local
    container_name: woca-ent-edge
    build:
      context: ../../build/dist
      dockerfile: Dockerfile
      args:
        ROLE_PKG: woca-edge.tar.gz
    command: ["--addr", ":8080"]
    restart: unless-stopped
    depends_on:
      woca-server-1: { condition: service_started }
      woca-config: { condition: service_started }
      nacos-init: { condition: service_completed_successfully }
    environment:
      WOCA_NACOS_URL: "http://nacos:8848"
      WOCA_SERVICE_URL: "nacos://nacos:8848/DEFAULT_GROUP/woca-edge.service"
      WOCA_CONFIGSVC_URL: "nacos://nacos:8848/DEFAULT_GROUP/woca-edge.config"
      WOCA_OBS_URL: "nacos://nacos:8848/DEFAULT_GROUP/woca-obs.otlp"
      WOCA_EDGE_ADDR: ":8080"
      WOCA_SERVICE_NAME: woca-ent-edge
      WOCA_OTEL_EXPORTER_OTLP_ENDPOINT: "nacos://nacos:8848/DEFAULT_GROUP/woca-obs.otlp"
      WOCA_EDGE_DEV_HTTP: "1"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/api/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
    ports:
      - "${ENT_EDGE_PORT:-8453}:8080"
    networks:
      - woca-dmz
      - woca-infra

  gateway:
    image: nginx:1.29-alpine
    container_name: woca-ent-gateway
    depends_on:
      woca-server-1: { condition: service_started }
      woca-server-2: { condition: service_started }
      # :8082 proxies the skill console to the ops facade — nginx resolves
      # upstream names once at config load, so it must exist first.
      woca-ops: { condition: service_started }
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:80/api/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
    restart: unless-stopped
    ports:
      # Business entry: load-balanced across woca-server instances
      - "${ENT_BUSINESS_PORT:-8080}:80"
      # Skill-svc management SPA
      - "${ENT_SKILL_PORT:-9082}:8082"
      # Component discovery & configuration (health + status)
      - "${ENT_DISCOVERY_PORT:-9083}:8083"
      # Config console (design §16): the settings management plane
      - "${ENT_CONFIG_PORT:-9086}:8086"
      # Langfuse ops UI (LLM tracing), reverse-proxied to the infra zone
      - "${ENT_LANGFUSE_PORT:-3000}:3000"
    volumes:
      - ./gateway/nginx-full.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - woca-dmz
      # Infra leg: ladyM stats (:8083 proxy targets) and the Langfuse
      # ops UI (:3000 reverse proxy).
      - woca-infra
      # Management-plane leg: the config console lives on woca-mgmt now.
      - woca-mgmt

  # ─────────────────── woca roles (stateless, edge) ──────────────────────
  woca-server-1: &woca-server
    image: woca-server:local
    container_name: woca-ent-server-1
    build:
      context: ../../build/dist
      dockerfile: Dockerfile
      args:
        ROLE_PKG: woca-server.tar.gz
    command: ["serve", "--addr", ":8080"]
    environment: &woca-server-env
      WOCA_DB: "nacos://nacos:8848/DEFAULT_GROUP/woca-db.dsn"
      WOCA_NACOS_URL: "http://nacos:8848"
      WOCA_AUTH: apikey
      # Phase 3 wiring: runs are enqueued for the workers (the PG queue is
      # the message plane until traffic needs NATS, design §5.4) and session
      # transcripts live on a volume shared with the workers.
      WOCA_RUN_DISPATCH: "queue"
      WOCA_RUNS_OFF_HOST: "true"
      WOCA_SESSION_DIR: "/var/lib/woca/sessions"
      # One secrets master key for every role (WOCA_HOME → shared volume):
      # secrets written by the config plane must decrypt in the roles.
      # ladyM wiring is operator-owned settings now (config console,
      # design §16) — no WOCA_LADYM_* env here.
      WOCA_HOME: "/var/lib/woca/home"
      # Telemetry (§12.2 env layer): the trace bridge address comes from
      # the registry like the DSN — resolved once at startup. Traces are
      # LLM/session reporting into Langfuse via woca-collector.
      WOCA_SERVICE_NAME: woca-server-1
      WOCA_OTEL_EXPORTER_OTLP_ENDPOINT: "nacos://nacos:8848/DEFAULT_GROUP/woca-obs.otlp"
      # Tenant ops console (v1.7 §6.7) on the internal gateway listener —
      # org credentials, enrollments, audit. Console sign-in env rides the
      # shared pair below; the listener stays on the internal networks.
      WOCA_GW_ADDR: ":8090"
      WOCA_CONSOLE_USER: ${WOCA_CONSOLE_USER:-}
      WOCA_CONSOLE_PASSWORD: ${WOCA_CONSOLE_PASSWORD:-}
    volumes:
      - woca-sessions:/var/lib/woca/sessions
      - woca-crypto:/var/lib/woca/home
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 15s
    restart: unless-stopped
    depends_on:
      # The nacos entries must exist before the role resolves its DSN.
      nacos-init: { condition: service_completed_successfully }
      woca-pg-primary: { condition: service_healthy }
    networks:
      woca-app:
      woca-data:
      # Infra leg (the compose 5-leg → 3 fold): NATS dispatch
      # notifications, nacos registry/pack delivery, ladyM, and the
      # woca-collector trace bridge all live on the infra zone now —
      # one interface, no cross-zone forwarding. The role alias feeds
      # Prometheus DNS-SD (job woca-server): every replica answers to it.
      woca-infra:
        aliases: ["woca-server"]

  woca-server-2:
    <<: *woca-server
    container_name: woca-ent-server-2
    environment:
      <<: *woca-server-env
      WOCA_SERVICE_NAME: woca-server-2
    ports: []

  # The console UI as its own service (v1.7 §6.7, split): the SPA plus a
  # stateless proxy onto server-1's pageless management API (:8090,
  # internal only). Login and the console session live server-side.
  woca-ops:
    image: woca-ops:local
    container_name: woca-ent-ops
    build:
      context: ../../build/dist
      dockerfile: Dockerfile
      args:
        ROLE_PKG: woca-ops.tar.gz
    environment:
      WOCA_OPS_ADDR: ":8091"
      WOCA_SERVICE_NAME: woca-ent-ops
      WOCA_OTEL_EXPORTER_OTLP_ENDPOINT: "nacos://nacos:8848/DEFAULT_GROUP/woca-obs.otlp"
      WOCA_OPS_UPSTREAM: "nacos://nacos:8848/DEFAULT_GROUP/woca-ops.upstream"
    # Dev-only host publish of the ops console. Prod keeps it strictly
    # internal.
    ports:
      - "127.0.0.1:${ENT_OPS_PORT:-9091}:8091"
    restart: unless-stopped
    depends_on:
      woca-server-1: { condition: service_started }
      # The upstream address resolves through nacos at startup.
      nacos-init: { condition: service_completed_successfully }
    networks:
      - woca-mgmt
      - woca-app

  woca-worker-1: &woca-worker
    image: woca-worker:local
    container_name: woca-ent-worker-1
    build:
      context: ../../build/dist
      dockerfile: Dockerfile
      args:
        ROLE_PKG: woca-worker.tar.gz
    environment: &woca-worker-env
      WOCA_DB: "nacos://nacos:8848/DEFAULT_GROUP/woca-db.dsn"
      WOCA_NACOS_URL: "http://nacos:8848"
      WOCA_OBS_ADDR: ":9092"
      # Telemetry (§12.2 env layer): the trace bridge via the registry,
      # same as the servers — the worker is where runs execute, so this
      # is where LLM/session spans originate.
      WOCA_SERVICE_NAME: woca-worker-1
      WOCA_OTEL_EXPORTER_OTLP_ENDPOINT: "nacos://nacos:8848/DEFAULT_GROUP/woca-obs.otlp"
      # Shared session transcripts (the same volume the servers mount), so
      # dispatched runs continue their session's history. WOCA_SANDBOX_*
      # would additionally route all tool execution to a sandbox service.
      WOCA_SESSION_DIR: "/var/lib/woca/sessions"
      WOCA_HOME: "/var/lib/woca/home"
    volumes:
      - woca-sessions:/var/lib/woca/sessions
      - woca-crypto:/var/lib/woca/home
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9092/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    depends_on:
      woca-pg-primary: { condition: service_healthy }
      # The nacos entries must exist before the role resolves its DSN.
      nacos-init: { condition: service_completed_successfully }
    networks:
      woca-app:
      woca-data:
      # Infra leg: see the servers' note above. The role alias feeds
      # Prometheus DNS-SD (job woca-worker).
      woca-infra:
        aliases: ["woca-worker"]

  woca-worker-2:
    <<: *woca-worker
    container_name: woca-ent-worker-2
    environment:
      <<: *woca-worker-env
      WOCA_SERVICE_NAME: woca-worker-2

  # Config plane (design §16): the standalone settings management role —
  # settings API (read/write/export/import) + the embedded ops console
  # SPA. Reached through the gateway's :8086 admin port; authenticated
  # with a local-tenant admin API key. Business roles pick up its writes
  # through the settings-generation watcher, so changes apply without
  # restarts.
  woca-config:
    image: woca-config:local
    container_name: woca-ent-config
    build:
      context: ../../build/dist
      dockerfile: Dockerfile
      args:
        ROLE_PKG: woca-config.tar.gz
    command: ["--addr", ":8080"]
    restart: unless-stopped
    depends_on:
      woca-pg-primary: { condition: service_healthy }
      # The nacos entries must exist before the role resolves its DSN.
      nacos-init: { condition: service_completed_successfully }
    environment:
      WOCA_DB: "nacos://nacos:8848/DEFAULT_GROUP/woca-db.dsn"
      WOCA_NACOS_URL: "http://nacos:8848"
      WOCA_OBS_ADDR: ":9093"
      WOCA_HOME: "/var/lib/woca/home"
      # Console sign-in (optional): set BOTH in .env to require
      # username/password login on the config console; unset = open.
      WOCA_CONSOLE_USER: ${WOCA_CONSOLE_USER:-}
      WOCA_CONSOLE_PASSWORD: ${WOCA_CONSOLE_PASSWORD:-}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/api/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s
    networks:
      - woca-mgmt
      - woca-data
      # Infra leg: tenant.dispatch wake-ups (NATS) + the nacos registry.
      - woca-infra
    volumes:
      - woca-crypto:/var/lib/woca/home

  # Admin toolbox: the business-plane key CLI runs on demand via
  # `docker exec` (human tenant management lives on the tenant ops
  # console — 127.0.0.1:9091, v1.7 §6.7; multi-tenancy grows that
  # console rather than adding a second surface here).
  woca-tenant:
    image: woca-tenant:local
    container_name: woca-ent-tenant
    build:
      context: ../../build/dist
      dockerfile: Dockerfile
      args:
        ROLE_PKG: woca-tenant.tar.gz
    entrypoint: ["sh", "-c", "echo 'woca-tenant: use docker exec to run commands' && sleep infinity"]
    restart: unless-stopped
    depends_on:
      woca-pg-primary: { condition: service_healthy }
      # The nacos entries must exist before the role resolves its DSN.
      nacos-init: { condition: service_completed_successfully }
    environment:
      WOCA_DB: "nacos://nacos:8848/DEFAULT_GROUP/woca-db.dsn"
      WOCA_HOME: "/var/lib/woca/home"
    networks:
      - woca-app
      - woca-data
      # Infra leg: tenant.dispatch wake-ups (NATS) + the nacos registry
      # (WOCA_DB resolves against nacos at startup).
      - woca-infra
    volumes:
      - woca-crypto:/var/lib/woca/home

  # ─────────────────────── ladyM (zone: infra) ────────────────────────────
  # Database physical isolation (§6.3.3) is instance-level: ladym-pg is
  # its own PostgreSQL/pgvector with its own volume and fault domain — no
  # cross-database joins with woca-pg. The former dedicated ladym network
  # folded into the infra zone (Terraform parity).
  # ladyM services run the dict-baked image: the operator-built base
  # (ladym-enterprise:local, see README-FULL.md) plus the sha256-pinned CJK
  # segmentation dictionary at /opt/ladym/dict — CJK recall works out of
  # the box, fully offline (ladyM never downloads dictionaries itself).
  # LADYM_DICT_VARIANT picks zh (default) | zh_s | zh_t | jp; pinned files
  # under ./dict/ make the build air-gapped (see Dockerfile.ladym-dict).
  ladym-pg:
    image: pgvector/pgvector:pg17
    container_name: woca-ent-ladym-pg
    environment:
      POSTGRES_USER: ladym
      POSTGRES_PASSWORD: ${LADYM_PG_PASSWORD:?set in .env}
      POSTGRES_DB: ladym
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ladym"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    volumes:
      - ladym-pg-data:/var/lib/postgresql/data
    networks:
      - woca-infra

  # The image entrypoint is /ladym with subcommands `serve` (HTTP
  # data-plane, the image's default CMD) and `worker`.
  ladym-api-1: &ladym-api
    image: ladym-enterprise:local-dict
    build:
      context: .
      dockerfile: Dockerfile.ladym-dict
      args:
        BASE: ladym-enterprise:local
        DICT_VARIANT: ${LADYM_DICT_VARIANT:-zh}
    container_name: woca-ent-ladym-api-1
    depends_on:
      ladym-pg: { condition: service_healthy }
    environment: &ladym-env
      LADYM_STORE_BACKEND: postgres
      LADYM_STORE_DSN: "postgres://ladym:${LADYM_PG_PASSWORD}@ladym-pg:5432/ladym"
    restart: unless-stopped
    networks:
      - woca-infra

  ladym-api-2:
    <<: *ladym-api
    container_name: woca-ent-ladym-api-2

  ladym-worker:
    image: ladym-enterprise:local-dict
    build:
      context: .
      dockerfile: Dockerfile.ladym-dict
      args:
        BASE: ladym-enterprise:local
        DICT_VARIANT: ${LADYM_DICT_VARIANT:-zh}
    container_name: woca-ent-ladym-worker
    depends_on:
      ladym-pg: { condition: service_healthy }
    environment:
      <<: *ladym-env
    command: ["worker"]
    restart: unless-stopped
    networks:
      - woca-infra

  # ─────────────── Langfuse (LLM tracing, zone: infra) ────────────────────
  # Langfuse v4 self-host (github.com/langfuse/langfuse, docker-compose.yml
  # of the upstream repo is the reference): web + worker over their own
  # dependency set — PostgreSQL (metadata), ClickHouse (traces), Redis
  # (queues), MinIO (blobs). Everything lives inside the observability
  # segment next to the obs overlay's pipeline, so the DOCKER-USER rules
  # isolate it from every other segment like the rest of obs.
  #
  # Trace wiring: the obs overlay's otel-collector fans OTLP traces out to
  # langfuse-web's /api/public/otel endpoint (Basic auth via
  # LANGFUSE_OTLP_AUTH — woca's exporter speaks credential-less OTLP, the
  # collector adds the headers). LANGFUSE_INIT_* seeds the org, project,
  # admin user and pins the project API keys on first boot, so the auth
  # header default below matches the default keys.
  langfuse-pg:
    image: postgres:17-alpine
    container_name: woca-ent-langfuse-pg
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: ${LANGFUSE_PG_PASSWORD:?set in .env}
      POSTGRES_DB: langfuse
      TZ: UTC
      PGTZ: UTC
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse"]
      interval: 3s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    volumes:
      - langfuse-pg-data:/var/lib/postgresql/data
    networks:
      - woca-infra

  langfuse-clickhouse:
    image: clickhouse/clickhouse-server:25.12
    container_name: woca-ent-langfuse-clickhouse
    user: "101:101"
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: langfuse
      CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD:?set in .env}
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 1s
    restart: unless-stopped
    volumes:
      - langfuse-clickhouse-data:/var/lib/clickhouse
      - langfuse-clickhouse-logs:/var/log/clickhouse-server
    networks:
      - woca-infra

  langfuse-redis:
    image: redis:7-alpine
    container_name: woca-ent-langfuse-redis
    command:
      - redis-server
      - --requirepass
      - ${LANGFUSE_REDIS_AUTH:?set in .env}
      - --maxmemory-policy
      - noeviction
    environment:
      # For the healthcheck below ($$ = compose escape, shell-side value).
      REDIS_AUTH: ${LANGFUSE_REDIS_AUTH:?set in .env}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_AUTH\" ping | grep -q PONG"]
      interval: 3s
      timeout: 10s
      retries: 10
    restart: unless-stopped
    volumes:
      - langfuse-redis-data:/data
    networks:
      - woca-infra

  # Blob storage (events overflow, media, exports): the bucket is created
  # by the entrypoint before the server starts (upstream pattern).
  langfuse-minio:
    image: cgr.dev/chainguard/minio
    container_name: woca-ent-langfuse-minio
    entrypoint: sh
    command:
      - -c
      - mkdir -p /data/langfuse && minio server --address ":9000" --console-address ":9001" /data
    environment:
      MINIO_ROOT_USER: ${LANGFUSE_MINIO_ROOT_USER:-langfuse}
      MINIO_ROOT_PASSWORD: ${LANGFUSE_MINIO_ROOT_PASSWORD:?set in .env}
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 1s
      timeout: 5s
      retries: 5
      start_period: 1s
    restart: unless-stopped
    volumes:
      - langfuse-minio-data:/data
    # Browser-facing blob endpoint (UI media upload): NOT published — the
    # same ruling as the Terraform side (media upload through the DMZ is
    # a later nginx location; not part of the ops surface).
    networks:
      - woca-infra

  langfuse-web:
    image: docker.langfuse.com/langfuse/langfuse:4.24.0
    container_name: woca-ent-langfuse-web
    depends_on: &langfuse-depends-on
      langfuse-pg: { condition: service_healthy }
      langfuse-clickhouse: { condition: service_healthy }
      langfuse-redis: { condition: service_healthy }
      langfuse-minio: { condition: service_healthy }
    environment: &langfuse-env
      # Next.js standalone binds to $HOSTNAME — Docker injects the
      # container id, which resolves to a single interface; pin the
      # wildcard so the in-container loopback healthcheck sees the port.
      HOSTNAME: 0.0.0.0
      NEXTAUTH_URL: ${LANGFUSE_NEXTAUTH_URL:-http://localhost:3000}
      DATABASE_URL: postgresql://langfuse:${LANGFUSE_PG_PASSWORD:?set in .env}@langfuse-pg:5432/langfuse
      SALT: ${LANGFUSE_SALT:?set in .env}
      ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY:?set in .env}
      # Private-deployment posture: no upstream telemetry.
      TELEMETRY_ENABLED: "false"
      CLICKHOUSE_MIGRATION_URL: clickhouse://langfuse-clickhouse:9000
      CLICKHOUSE_URL: http://langfuse-clickhouse:8123
      CLICKHOUSE_USER: langfuse
      CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD:?set in .env}
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${LANGFUSE_MINIO_ROOT_USER:-langfuse}
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_MINIO_ROOT_PASSWORD:?set in .env}
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://langfuse-minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
      LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
      LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: ${LANGFUSE_MINIO_ROOT_USER:-langfuse}
      LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_MINIO_ROOT_PASSWORD:?set in .env}
      # The browser-reachable MinIO address (media upload bypasses web).
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: ${LANGFUSE_MINIO_EXTERNAL_ENDPOINT:-http://localhost:9090}
      LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/
      REDIS_HOST: langfuse-redis
      REDIS_PORT: "6379"
      REDIS_AUTH: ${LANGFUSE_REDIS_AUTH:?set in .env}
      # Deterministic bootstrap: org/project/admin user seeded on first
      # boot with pinned API keys, so the collector's Basic auth default
      # matches. Override the key pair in .env AND the LANGFUSE_OTLP_AUTH
      # header together (printf 'pk:sk' | base64).
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:?set in .env}
      LANGFUSE_INIT_ORG_ID: ${LANGFUSE_INIT_ORG_ID:-woca-org}
      LANGFUSE_INIT_ORG_NAME: ${LANGFUSE_INIT_ORG_NAME:-woca}
      LANGFUSE_INIT_PROJECT_ID: ${LANGFUSE_INIT_PROJECT_ID:-woca-project}
      LANGFUSE_INIT_PROJECT_NAME: ${LANGFUSE_INIT_PROJECT_NAME:-woca}
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_INIT_PROJECT_PUBLIC_KEY:-pk-lf-woca-local}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_INIT_PROJECT_SECRET_KEY:-sk-lf-woca-local}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_INIT_USER_EMAIL:-admin@woca.local}
      LANGFUSE_INIT_USER_NAME: ${LANGFUSE_INIT_USER_NAME:-woca admin}
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_INIT_USER_PASSWORD:-woca-langfuse-admin}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/public/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - woca-infra

  langfuse-worker:
    image: docker.langfuse.com/langfuse/langfuse-worker:4.24.0
    container_name: woca-ent-langfuse-worker
    depends_on: *langfuse-depends-on
    environment:
      <<: *langfuse-env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3030/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - woca-infra

networks:
  # Five zones, 1:1 with the Terraform reference (deploy/terraform/aws):
  # dmz = the public gateway half of the edge, app = the business half,
  # data = OLTP storage, infra = the platform substrate (NATS + ladyM +
  # nacos + trace bridge + Langfuse), mgmt = the consoles only.
  woca-dmz:
    name: woca-ent-dmz
    ipam:
      config: [{ subnet: 172.28.30.0/24 }]

  woca-app:
    name: woca-ent-app
    ipam:
      config: [{ subnet: 172.28.32.0/24 }]

  woca-data:
    name: woca-ent-data
    ipam:
      config: [{ subnet: 172.28.10.0/24 }]

  woca-infra:
    name: woca-ent-infra
    ipam:
      config: [{ subnet: 172.28.20.0/24 }]

  # Management zone: the consoles only. Roles never attach here (nacos
  # rides infra), so an mgmt outage never blocks role restarts.
  woca-mgmt:
    name: woca-ent-mgmt
    ipam:
      config: [{ subnet: 172.28.50.0/24 }]

volumes:
  woca-sessions:
    name: woca-ent-full-sessions
  woca-crypto:
    name: woca-ent-full-crypto
  woca-pg-primary-data:
    name: woca-ent-full-pg-primary
  woca-pg-replica-data:
    name: woca-ent-full-pg-replica
  nats-js-1-data:
    name: woca-ent-full-nats-1
  nats-js-2-data:
    name: woca-ent-full-nats-2
  nats-js-3-data:
    name: woca-ent-full-nats-3
  ladym-pg-data:
    name: woca-ent-full-ladym-pg
  langfuse-pg-data:
    name: woca-ent-full-langfuse-pg
  langfuse-clickhouse-data:
    name: woca-ent-full-langfuse-clickhouse
  langfuse-clickhouse-logs:
    name: woca-ent-full-langfuse-clickhouse-logs
  langfuse-redis-data:
    name: woca-ent-full-langfuse-redis
  langfuse-minio-data:
    name: woca-ent-full-langfuse-minio
