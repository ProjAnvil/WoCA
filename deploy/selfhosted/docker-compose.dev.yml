# woca dev environment: the minimal twin of docker-compose.full.yml
#
# Same microservice topology (gateway → woca-server/worker/config/tenant,
# ladyM) with the smallest viable instance counts — one of everything, a
# single PostgreSQL (no hot-standby), a single NATS node, and NO
# observability stack. Built for development 联调: fast to start, cheap to
# throw away, ports identical to full so the two are drop-in replacements.
#
# The full stack's five-zone model (dmz/app/data/infra/mgmt — see
# docker-compose.full.yml, kept 1:1 with the Terraform reference) is
# deliberately FLATTENED here: one network, every service on it. Dev is a
# 联调 harness, not a threat model — the zone split buys nothing at this
# scale and costs a wall of network boilerplate. What still mirrors full:
# the service inventory (one of each role), the nacos-addressed trace
# bridge (woca-collector + Langfuse via `make dev-langfuse`), the host
# ports, and the data model.
#
# Volumes are dev-owned (woca-dev-*): dev data never touches full's.
# Lifecycle: `make dev-up` / `make dev-down`. The full stack must be down
# first (`make ent-full-down`) — the host ports are the same by design.

name: woca-enterprise-dev

services:
  # ─────────────────────── PostgreSQL (segment: pg) ───────────────────────
  # Single node, no replication: the same initdb conventions as full.
  woca-pg-primary:
    image: postgres:16-alpine
    container_name: woca-dev-pg
    environment:
      POSTGRES_USER: woca
      POSTGRES_PASSWORD: ${WOCA_PG_PASSWORD:?set in .env}
      POSTGRES_DB: woca
      WOCA_PG_REPL_PASSWORD: ${WOCA_PG_REPL_PASSWORD}
    command:
      - postgres
      - -c
      - listen_addresses=*
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U woca -d woca"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    volumes:
      - woca-pg-primary-data:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    networks:
      - woca

  # ─────────────────────── NATS JetStream (segment: mq) ───────────────────
  nats-js-1:
    image: nats:2.11-alpine
    container_name: woca-dev-nats
    command:
      - nats-server
      - -js
      - --name
      - nats-js-1
      - --http_port
      - "8222"
      - --store_dir
      - /data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8222/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    volumes:
      - nats-js-1-data:/data
    networks:
      - woca

  # One-shot: the same platform streams as full, single-node (R1).
  nats-init:
    image: synadia/nats-box:latest
    container_name: woca-dev-nats-init
    depends_on:
      nats-js-1: { condition: service_healthy }
    environment:
      NATS_URL: nats://nats-js-1:4222
    entrypoint:
      - /bin/sh
      - -ec
      - |
        nats stream info WOCA_RUNS >/dev/null 2>&1 || \
        nats stream create WOCA_RUNS \
          --subjects 'runs.>' \
          --storage file --retention work --replicas 1 --discard new \
          --max-msgs=-1 --max-msg-size=-1 \
          --dupe-window 2m --max-age 168h --max-bytes 2147483648
        nats stream info WOCA_EVENTS >/dev/null 2>&1 || \
        nats stream create WOCA_EVENTS \
          --subjects 'events.>' \
          --storage file --retention limits --replicas 1 --discard old \
          --max-msgs=-1 --max-msg-size=-1 \
          --dupe-window 2m --max-age 24h --max-bytes 5368709120
        echo "woca-dev JetStream streams ready"
    restart: "no"
    networks:
      - woca

  # ─────────────────────────── gateway (L1, edge) ──────────────────────────
  gateway:
    image: nginx:1.29-alpine
    container_name: woca-dev-gateway
    depends_on:
      woca-server-1: { condition: service_started }
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:80/api/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
    restart: unless-stopped
    ports:
      - "${ENT_BUSINESS_PORT:-8080}:80"
      - "${ENT_SKILL_PORT:-9082}:8082"
      - "${ENT_DISCOVERY_PORT:-9083}:8083"
      - "${ENT_CONFIG_PORT:-9086}:8086"
    volumes:
      - ./gateway/nginx-dev.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - woca

  # ─────────────────── woca roles (stateless, edge) ──────────────────────
  woca-server-1:
    image: woca-server:local
    container_name: woca-dev-server-1
    build:
      context: ../../build/dist
      dockerfile: Dockerfile
      args:
        ROLE_PKG: woca-server.tar.gz
    command: ["serve", "--addr", ":8080"]
    environment:
      WOCA_DB: "nacos://nacos:8848/DEFAULT_GROUP/woca-db.dsn"
      WOCA_NACOS_URL: "http://nacos:8848"
      WOCA_AUTH: apikey
      WOCA_RUN_DISPATCH: "queue"
      WOCA_RUNS_OFF_HOST: "true"
      WOCA_SESSION_DIR: "/var/lib/woca/sessions"
      WOCA_HOME: "/var/lib/woca/home"
      # Service-plane gateway listener (v1.5 拓扑拆分): the machine
      # registry (/gw/enroll|renew|heartbeat|resolve/bridges) the edge
      # access point calls home to — internal network only — plus the
      # tenant ops console (v1.7 §6.7): tenants & keys, enrollments,
      # audit. Same console sign-in env as the config console.
      WOCA_GW_ADDR: ":8090"
      WOCA_CONSOLE_USER: ${WOCA_CONSOLE_USER:-}
      WOCA_CONSOLE_PASSWORD: ${WOCA_CONSOLE_PASSWORD:-}
      # Dev posture: certificate-less bridges on by default at startup
      # (production images never set this — R6; not a console knob). The
      # gateway posture is seeded by the SERVER role (it owns the
      # registry), not the config plane.
      WOCA_INSECURE_BRIDGES: "1"
      # Telemetry (§12.2 env layer): the trace bridge address resolved
      # from the registry at startup, exactly like WOCA_DB — LLM/session
      # spans land in Langfuse when its profile is on, the bridge drops
      # them otherwise.
      WOCA_SERVICE_NAME: woca-dev-server-1
      WOCA_OTEL_EXPORTER_OTLP_ENDPOINT: "nacos://nacos:8848/DEFAULT_GROUP/woca-obs.otlp"
    volumes:
      - woca-sessions:/var/lib/woca/sessions
      - woca-crypto:/var/lib/woca/home
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 15s
    restart: unless-stopped
    depends_on:
      woca-pg-primary: { condition: service_healthy }
      nacos-init: { condition: service_completed_successfully }
    networks:
      - woca

  # The console as its own service (v1.7 §6.7, split). The dev stack uses
  # the direct assembly: the console runs self-contained over the shared
  # database (like the config console — both consoles stay direct-PG here),
  # no woca-server hop. The full stack uses the proxy assembly instead.
  ops:
    image: woca-ops:dev
    container_name: woca-dev-ops
    build:
      context: ../../build/dist
      dockerfile: Dockerfile
      args:
        ROLE_PKG: woca-ops.tar.gz
    environment:
      WOCA_OPS_ADDR: ":8091"
      WOCA_SERVICE_NAME: woca-dev-ops
      WOCA_OTEL_EXPORTER_OTLP_ENDPOINT: "nacos://nacos:8848/DEFAULT_GROUP/woca-obs.otlp"
      WOCA_DB: "nacos://nacos:8848/DEFAULT_GROUP/woca-db.dsn"
      WOCA_HOME: "/var/lib/woca/home"
      WOCA_CONSOLE_USER: ${WOCA_CONSOLE_USER:-}
      WOCA_CONSOLE_PASSWORD: ${WOCA_CONSOLE_PASSWORD:-}
    volumes:
      - woca-crypto:/var/lib/woca/home
    restart: unless-stopped
    depends_on:
      woca-pg-primary: { condition: service_healthy }
      # WOCA_DB is a nacos reference — the entries must exist first.
      nacos-init: { condition: service_completed_successfully }
    # Dev only: the tenant ops console (v1.7 §6.7) on the host loopback —
    # tenants & keys, enrollment tokens, bridge inventory, audit. Prod
    # keeps it strictly on the private network.
    ports:
      - "127.0.0.1:${DEV_OPS_PORT:-9091}:8091"
    networks:
      - woca

  woca-worker-1:
    image: woca-worker:local
    container_name: woca-dev-worker-1
    build:
      context: ../../build/dist
      dockerfile: Dockerfile
      args:
        ROLE_PKG: woca-worker.tar.gz
    environment:
      WOCA_DB: "nacos://nacos:8848/DEFAULT_GROUP/woca-db.dsn"
      WOCA_NACOS_URL: "http://nacos:8848"
      WOCA_OBS_ADDR: ":9091"
      WOCA_SESSION_DIR: "/var/lib/woca/sessions"
      WOCA_HOME: "/var/lib/woca/home"
      # Same registry-resolved trace bridge as woca-server-1 — the worker
      # is where runs execute, so this is where LLM/session spans
      # originate.
      WOCA_SERVICE_NAME: woca-dev-worker-1
      WOCA_OTEL_EXPORTER_OTLP_ENDPOINT: "nacos://nacos:8848/DEFAULT_GROUP/woca-obs.otlp"
    volumes:
      - woca-sessions:/var/lib/woca/sessions
      - woca-crypto:/var/lib/woca/home
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9091/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    depends_on:
      woca-pg-primary: { condition: service_healthy }
      nacos-init: { condition: service_completed_successfully }
    networks:
      - woca

  # Config plane (design §16): settings management + its console (woca
  # settings domains only — tenant/bridge governance lives on the server
  # role's ops console, v1.7) + the config pull (/gw/config) for bridges.
  # The registry routes moved to the service plane (v1.5); the edge
  # forwards.
  woca-config:
    image: woca-config:local
    container_name: woca-dev-config
    build:
      context: ../../build/dist
      dockerfile: Dockerfile
      args:
        ROLE_PKG: woca-config.tar.gz
    command: ["--addr", ":8080"]
    restart: unless-stopped
    depends_on:
      woca-pg-primary: { condition: service_healthy }
      nacos-init: { condition: service_completed_successfully }
    environment:
      WOCA_DB: "nacos://nacos:8848/DEFAULT_GROUP/woca-db.dsn"
      WOCA_NACOS_URL: "http://nacos:8848"
      WOCA_OBS_ADDR: ":9093"
      WOCA_HOME: "/var/lib/woca/home"
      # Console sign-in (optional): set BOTH to require username/password
      # login; unset = open console (the dev default).
      WOCA_CONSOLE_USER: ${WOCA_CONSOLE_USER:-}
      WOCA_CONSOLE_PASSWORD: ${WOCA_CONSOLE_PASSWORD:-}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/api/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s
    networks:
      - woca
    volumes:
      - woca-crypto:/var/lib/woca/home

  # Edge access point (v1.5 拓扑拆分): the stateless public entry the
  # twin's bridge registers through — scenario four in the microservices
  # twin. Plain HTTP is the twin's dev posture (WOCA_EDGE_DEV_HTTP).
  woca-edge:
    image: woca-edge:local
    container_name: woca-dev-edge
    build:
      context: ../../build/dist
      dockerfile: Dockerfile
      args:
        ROLE_PKG: woca-edge.tar.gz
    command: ["--addr", ":8080"]
    restart: unless-stopped
    depends_on:
      woca-server-1: { condition: service_started }
      woca-config: { condition: service_started }
      nacos-init: { condition: service_completed_successfully }
    environment:
      WOCA_NACOS_URL: "http://nacos:8848"
      WOCA_SERVICE_URL: "nacos://nacos:8848/DEFAULT_GROUP/woca-edge.service"
      WOCA_CONFIGSVC_URL: "nacos://nacos:8848/DEFAULT_GROUP/woca-edge.config"
      WOCA_EDGE_ADDR: ":8080"
      WOCA_SERVICE_NAME: woca-dev-edge
      WOCA_OTEL_EXPORTER_OTLP_ENDPOINT: "nacos://nacos:8848/DEFAULT_GROUP/woca-obs.otlp"
      WOCA_EDGE_DEV_HTTP: "1"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/api/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
    ports:
      - "${ENT_EDGE_PORT:-8453}:8080"
    networks:
      - woca

  # Admin toolbox: tenant/key commands via `docker exec woca-dev-tenant`
  # (business-plane API keys; the config console itself no longer uses keys).
  woca-tenant:
    image: woca-tenant:local
    container_name: woca-dev-tenant
    build:
      context: ../../build/dist
      dockerfile: Dockerfile
      args:
        ROLE_PKG: woca-tenant.tar.gz
    entrypoint: ["sh", "-c", "echo 'woca-tenant: use docker exec to run commands' && sleep infinity"]
    restart: unless-stopped
    depends_on:
      woca-pg-primary: { condition: service_healthy }
    environment:
      WOCA_DB: "nacos://nacos:8848/DEFAULT_GROUP/woca-db.dsn"
      WOCA_HOME: "/var/lib/woca/home"
    networks:
      - woca
    volumes:
      - woca-crypto:/var/lib/woca/home

  # ─────────────── dev bridge (profile: bridge) ────────────────────────────
  # The execution plane as a container with a full dev tool chain
  # (python/node/npm/bun): the browser drives http://localhost:3490, the
  # agent's tool calls execute inside this container, and the control-plane
  # link (enrollment, managed config) reaches woca-config over the compose
  # network. Opt-in via `make dev-bridge` — plain `dev-up` stays minimal.
  bridge:
    image: woca-bridge-dev:local
    container_name: woca-dev-bridge
    profiles: ["bridge"]
    build:
      context: ../../build/dist
      dockerfile: Dockerfile
      args:
        ROLE_PKG: woca-bridge.tar.gz
    command: ["serve", "--addr", "0.0.0.0:8080", "--auth", "apikey"]
    restart: unless-stopped
    ports:
      # The bridge serves the same SPA as woca web (design D1) — open
      # http://localhost:3490 and sign in with a tenant key from the ops
      # console (the bridge itself issues no keys, v1.7).
      - "${DEV_BRIDGE_PORT:-3490}:8080"
    environment:
      WOCA_AUTH: apikey
      WOCA_HOME: /var/lib/woca
      # Control-plane link through the edge access point (v1.5: the bridge
      # sees only the edge). First enrollment under the apikey posture goes
      # through WOCA_ENROLL_TOKEN (from the tenant ops console on the
      # server role), or `docker exec woca-dev-bridge woca-bridge gateway
      # request --url http://woca-edge:8080` for the worker-led flow
      # (approve the fingerprint on the ops console).
      WOCA_EDGE_URL: http://woca-edge:8080
      WOCA_ENROLL_TOKEN: ${DEV_ENROLL_TOKEN:-}
      WOCA_SESSION_DIR: /var/lib/woca/sessions
      # Folder-browser jail: the workspace first, home as a fallback root.
      WOCA_FS_ROOTS: /workspace:/root
    volumes:
      - woca-bridge-home:/var/lib/woca
      - woca-bridge-workspace:/workspace
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null http://127.0.0.1:8080/api/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s
    networks:
      - woca

  # ─────────────────── ladyM (minimal: one api + worker) ──────────────────
  # Same dict-baked image as the full stack: the operator-built base
  # (ladym-enterprise:local) plus the sha256-pinned CJK dictionary at
  # /opt/ladym/dict (Dockerfile.ladym-dict) — dev runs CJK segmentation
  # out of the box, no runtime download. LADYM_DICT_VARIANT picks
  # zh (default) | zh_s | zh_t | jp.
  ladym-pg:
    image: pgvector/pgvector:pg17
    container_name: woca-dev-ladym-pg
    environment:
      POSTGRES_USER: ladym
      POSTGRES_PASSWORD: ${LADYM_PG_PASSWORD:?set in .env}
      POSTGRES_DB: ladym
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ladym"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    volumes:
      - ladym-pg-data:/var/lib/postgresql/data
    networks:
      - woca

  ladym-api:
    image: ladym-enterprise:local-dict
    build:
      context: .
      dockerfile: Dockerfile.ladym-dict
      args:
        BASE: ladym-enterprise:local
        DICT_VARIANT: ${LADYM_DICT_VARIANT:-zh}
    container_name: woca-dev-ladym-api
    depends_on:
      ladym-pg: { condition: service_healthy }
    environment:
      LADYM_STORE_BACKEND: postgres
      LADYM_STORE_DSN: "postgres://ladym:${LADYM_PG_PASSWORD}@ladym-pg:5432/ladym"
    restart: unless-stopped
    networks:
      - woca

  ladym-worker:
    image: ladym-enterprise:local-dict
    build:
      context: .
      dockerfile: Dockerfile.ladym-dict
      args:
        BASE: ladym-enterprise:local
        DICT_VARIANT: ${LADYM_DICT_VARIANT:-zh}
    container_name: woca-dev-ladym-worker
    depends_on:
      ladym-pg: { condition: service_healthy }
    environment:
      LADYM_STORE_BACKEND: postgres
      LADYM_STORE_DSN: "postgres://ladym:${LADYM_PG_PASSWORD}@ladym-pg:5432/ladym"
    command: ["worker"]
    restart: unless-stopped
    networks:
      - woca

  # ─────────────────── nacos: discovery + config delivery ────────────────
  # Same posture as the full stack: the registry carries the service
  # addresses and the delivered configuration pack (sole source of
  # truth). The dev consoles (ops direct, config) stay direct-PG by
  # design; the business roles register and subscribe here.
  nacos:
    image: nacos/nacos-server:v2.4.3
    container_name: woca-dev-nacos
    environment:
      MODE: standalone
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8848/nacos/v1/console/health/readiness || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s
    restart: unless-stopped
    networks:
      - woca

  nacos-init:
    image: curlimages/curl:8.10.1
    container_name: woca-dev-nacos-init
    depends_on:
      nacos: { condition: service_healthy }
    environment:
      WOCA_PG_PASSWORD: ${WOCA_PG_PASSWORD:?set in .env}
    entrypoint:
      - /bin/sh
      - -ec
      - |
        publish() {  # dataId content
          curl -sf -X POST "http://nacos:8848/nacos/v1/cs/configs" \
            --data-urlencode "dataId=$$1" \
            --data-urlencode "group=DEFAULT_GROUP" \
            --data-urlencode "content=$$2"
          i=0
          until [ "$$(curl -sf "http://nacos:8848/nacos/v1/cs/configs?dataId=$$1&group=DEFAULT_GROUP")" = "$$2" ]; do
            i=$$((i+1)); [ $$i -gt 30 ] && { echo "nacos read-back of $$1 never settled"; exit 1; }
            sleep 1
          done
          echo "published $$1"
        }
        publish woca-db.dsn "postgres://woca:$${WOCA_PG_PASSWORD}@woca-pg-primary:5432/woca?sslmode=disable"
        publish woca-ops.upstream "http://woca-server-1:8090"
        publish woca-edge.service "http://woca-server-1:8090"
        publish woca-edge.config "http://woca-config:8080"
        publish woca-obs.otlp "http://woca-collector:4318"
        publish woca-config.pack '{"version":1,"generation":"","settings":{}}'
        echo "nacos entries ready"
    restart: "no"
    networks:
      - woca

  # ─────────────── Langfuse (profile: langfuse) ───────────────────────────
  # LLM tracing for dev 联调: the same Langfuse v4 group as the full
  # stack's infra zone (see docker-compose.full.yml) — web + worker over
  # their own PostgreSQL, ClickHouse, Redis and MinIO. Opt in with `make
  # dev-langfuse`; everything is dev-defaulted (fixed keys/passwords,
  # woca-dev-* volumes). The roles' spans already flow to the always-on
  # woca-collector bridge; with this profile off the bridge drops them,
  # plain dev-up stays otherwise identical.
  langfuse-pg:
    image: postgres:17-alpine
    container_name: woca-dev-langfuse-pg
    profiles: ["langfuse"]
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: ${LANGFUSE_PG_PASSWORD:-woca-dev-langfuse-pg}
      POSTGRES_DB: langfuse
      TZ: UTC
      PGTZ: UTC
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse"]
      interval: 3s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    volumes:
      - langfuse-pg-data:/var/lib/postgresql/data
    networks:
      - woca

  langfuse-clickhouse:
    image: clickhouse/clickhouse-server:25.12
    container_name: woca-dev-langfuse-clickhouse
    profiles: ["langfuse"]
    user: "101:101"
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: langfuse
      CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD:-woca-dev-langfuse-ch}
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 1s
    restart: unless-stopped
    volumes:
      - langfuse-clickhouse-data:/var/lib/clickhouse
      - langfuse-clickhouse-logs:/var/log/clickhouse-server
    networks:
      - woca

  langfuse-redis:
    image: redis:7-alpine
    container_name: woca-dev-langfuse-redis
    profiles: ["langfuse"]
    command:
      - redis-server
      - --requirepass
      - ${LANGFUSE_REDIS_AUTH:-woca-dev-langfuse-redis}
      - --maxmemory-policy
      - noeviction
    environment:
      # For the healthcheck below ($$ = compose escape, shell-side value).
      REDIS_AUTH: ${LANGFUSE_REDIS_AUTH:-woca-dev-langfuse-redis}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_AUTH\" ping | grep -q PONG"]
      interval: 3s
      timeout: 10s
      retries: 10
    restart: unless-stopped
    volumes:
      - langfuse-redis-data:/data
    networks:
      - woca

  langfuse-minio:
    image: cgr.dev/chainguard/minio
    container_name: woca-dev-langfuse-minio
    profiles: ["langfuse"]
    entrypoint: sh
    command:
      - -c
      - mkdir -p /data/langfuse && minio server --address ":9000" --console-address ":9001" /data
    environment:
      MINIO_ROOT_USER: ${LANGFUSE_MINIO_ROOT_USER:-langfuse}
      MINIO_ROOT_PASSWORD: ${LANGFUSE_MINIO_ROOT_PASSWORD:-woca-dev-langfuse-minio}
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 1s
      timeout: 5s
      retries: 5
      start_period: 1s
    restart: unless-stopped
    volumes:
      - langfuse-minio-data:/data
    # Browser-facing blob endpoint for the Langfuse UI's media uploads:
    # published on all interfaces (the UI is served to ops the same way).
    ports:
      - "${DEV_LANGFUSE_MINIO_PORT:-9090}:9000"
    networks:
      - woca

  langfuse-web:
    image: docker.langfuse.com/langfuse/langfuse:4.24.0
    container_name: woca-dev-langfuse-web
    profiles: ["langfuse"]
    depends_on: &langfuse-depends-on
      langfuse-pg: { condition: service_healthy }
      langfuse-clickhouse: { condition: service_healthy }
      langfuse-redis: { condition: service_healthy }
      langfuse-minio: { condition: service_healthy }
    environment: &langfuse-env
      # Next.js standalone binds to $HOSTNAME — Docker injects the
      # container id, which resolves to a single interface; pin the
      # wildcard so the in-container loopback healthcheck sees the port.
      HOSTNAME: 0.0.0.0
      NEXTAUTH_URL: ${LANGFUSE_NEXTAUTH_URL:-http://localhost:3000}
      DATABASE_URL: postgresql://langfuse:${LANGFUSE_PG_PASSWORD:-woca-dev-langfuse-pg}@langfuse-pg:5432/langfuse
      # Dev posture: fixed secrets (the full stack demands real ones in
      # .env); no upstream telemetry.
      SALT: ${LANGFUSE_SALT:-woca-dev-langfuse-salt}
      ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY:-eb2016df8cf11b0ad8e563d8904b97864c03c514ca69d79406b5108d3827cddd}
      TELEMETRY_ENABLED: "false"
      CLICKHOUSE_MIGRATION_URL: clickhouse://langfuse-clickhouse:9000
      CLICKHOUSE_URL: http://langfuse-clickhouse:8123
      CLICKHOUSE_USER: langfuse
      CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD:-woca-dev-langfuse-ch}
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${LANGFUSE_MINIO_ROOT_USER:-langfuse}
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_MINIO_ROOT_PASSWORD:-woca-dev-langfuse-minio}
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://langfuse-minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
      LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
      LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: ${LANGFUSE_MINIO_ROOT_USER:-langfuse}
      LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_MINIO_ROOT_PASSWORD:-woca-dev-langfuse-minio}
      # The browser-reachable MinIO address (media upload bypasses web).
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: ${LANGFUSE_MINIO_EXTERNAL_ENDPOINT:-http://localhost:9090}
      LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/
      REDIS_HOST: langfuse-redis
      REDIS_PORT: "6379"
      REDIS_AUTH: ${LANGFUSE_REDIS_AUTH:-woca-dev-langfuse-redis}
      # Deterministic bootstrap (same defaults as the full stack): the
      # seeded project keys match LANGFUSE_OTLP_AUTH below.
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:-woca-dev-langfuse-nextauth}
      LANGFUSE_INIT_ORG_ID: ${LANGFUSE_INIT_ORG_ID:-woca-org}
      LANGFUSE_INIT_ORG_NAME: ${LANGFUSE_INIT_ORG_NAME:-woca}
      LANGFUSE_INIT_PROJECT_ID: ${LANGFUSE_INIT_PROJECT_ID:-woca-project}
      LANGFUSE_INIT_PROJECT_NAME: ${LANGFUSE_INIT_PROJECT_NAME:-woca}
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_INIT_PROJECT_PUBLIC_KEY:-pk-lf-woca-local}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_INIT_PROJECT_SECRET_KEY:-sk-lf-woca-local}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_INIT_USER_EMAIL:-admin@woca.local}
      LANGFUSE_INIT_USER_NAME: ${LANGFUSE_INIT_USER_NAME:-woca admin}
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_INIT_USER_PASSWORD:-woca-langfuse-admin}
    restart: unless-stopped
    ports:
      # Ops-facing UI: published on all interfaces like the official
      # upstream compose (3000 = the only app port meant for humans).
      # Reach Langfuse from another machine over this port by also
      # pointing LANGFUSE_NEXTAUTH_URL at the reachable host.
      - "${DEV_LANGFUSE_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/public/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - woca

  langfuse-worker:
    image: docker.langfuse.com/langfuse/langfuse-worker:4.24.0
    container_name: woca-dev-langfuse-worker
    profiles: ["langfuse"]
    depends_on: *langfuse-depends-on
    environment:
      <<: *langfuse-env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3030/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - woca

  # ─────────────── woca-collector: the trace bridge ──────────────────────
  # Always on (deploy/collector/): the roles push credential-less OTLP
  # here (the nacos entry woca-obs.otlp points at it — resolved at startup
  # like WOCA_DB), the bridge owns the Langfuse path + Basic auth and the
  # session.id tag mapping. With the langfuse profile off, exports fail
  # fast and drop — plain dev-up carries no tracing dependencies beyond
  # this lightweight hop. On the flat network, like everything else in
  # dev.
  woca-collector:
    image: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib:0.136.0
    container_name: woca-dev-collector
    command: ["--config=/etc/otelcol/config.yaml"]
    environment:
      LANGFUSE_OTLP_AUTH: ${LANGFUSE_OTLP_AUTH:-Basic cGstbGYtd29jYS1sb2NhbDpzay1sZi13b2NhLWxvY2Fs}
    volumes:
      - ../collector/config-dev.yaml:/etc/otelcol/config.yaml:ro
    restart: unless-stopped
    networks:
      - woca
networks:
  # One flat network: the five-zone model is full's job, not dev's.
  # Distinct name + subnet from full's zones, so a stale full container
  # cannot silently collide with dev networking.
  woca:
    name: woca-dev-net
    ipam:
      config: [{ subnet: 172.28.190.0/24 }]

volumes:
  woca-sessions:
    name: woca-dev-sessions
  woca-bridge-home:
    name: woca-dev-bridge-home
  woca-bridge-workspace:
    name: woca-dev-bridge-workspace
  woca-crypto:
    name: woca-dev-crypto
  woca-pg-primary-data:
    name: woca-dev-pg
  nats-js-1-data:
    name: woca-dev-nats
  ladym-pg-data:
    name: woca-dev-ladym-pg
  langfuse-pg-data:
    name: woca-dev-langfuse-pg
  langfuse-clickhouse-data:
    name: woca-dev-langfuse-clickhouse
  langfuse-clickhouse-logs:
    name: woca-dev-langfuse-clickhouse-logs
  langfuse-redis-data:
    name: woca-dev-langfuse-redis
  langfuse-minio-data:
    name: woca-dev-langfuse-minio
