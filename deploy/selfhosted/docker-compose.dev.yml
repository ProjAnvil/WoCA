# woca dev environment: the minimal twin of docker-compose.full.yml
#
# Same microservice topology (gateway → woca-server/worker/config/tenant,
# ladyM) with the smallest viable instance counts — one of everything, a
# single PostgreSQL (no hot-standby), a single NATS node, and NO
# observability stack. Built for development 联调: fast to start, cheap to
# throw away, ports identical to full so the two are drop-in replacements.
#
#   full (unchanged)                     dev (this file)
#   ────────────────────────────────     ─────────────────────────────
#   pg-primary + pg-replica              pg ×1
#   nats-js ×3 (R3 streams)              nats ×1 (R1 streams)
#   woca-server ×2 / worker ×2           server ×1 / worker ×1
#   ladym-api ×2 + worker                ladym-api ×1 + worker
#   firewall one-shot (DOCKER-USER)      —
#   observability overlay (§12.3)        —
#
# Volumes are dev-owned (woca-dev-*): dev data never touches full's.
# Lifecycle: `make dev-up` / `make dev-down`. The full stack must be down
# first (`make ent-full-down`) — the host ports are the same by design.

name: woca-enterprise-dev

services:
  # ─────────────────────── PostgreSQL (segment: pg) ───────────────────────
  # Single node, no replication: the same initdb conventions as full.
  woca-pg-primary:
    image: postgres:16-alpine
    container_name: woca-dev-pg
    environment:
      POSTGRES_USER: woca
      POSTGRES_PASSWORD: ${WOCA_PG_PASSWORD:?set in .env}
      POSTGRES_DB: woca
      WOCA_PG_REPL_PASSWORD: ${WOCA_PG_REPL_PASSWORD}
    command:
      - postgres
      - -c
      - listen_addresses=*
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U woca -d woca"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    volumes:
      - woca-pg-primary-data:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    networks:
      - woca-pg

  # ─────────────────────── NATS JetStream (segment: mq) ───────────────────
  nats-js-1:
    image: nats:2.11-alpine
    container_name: woca-dev-nats
    command:
      - nats-server
      - -js
      - --name
      - nats-js-1
      - --http_port
      - "8222"
      - --store_dir
      - /data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8222/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    volumes:
      - nats-js-1-data:/data
    networks:
      - woca-mq

  # One-shot: the same platform streams as full, single-node (R1).
  nats-init:
    image: synadia/nats-box:latest
    container_name: woca-dev-nats-init
    depends_on:
      nats-js-1: { condition: service_healthy }
    environment:
      NATS_URL: nats://nats-js-1:4222
    entrypoint:
      - /bin/sh
      - -ec
      - |
        nats stream info WOCA_RUNS >/dev/null 2>&1 || \
        nats stream create WOCA_RUNS \
          --subjects 'runs.>' \
          --storage file --retention work --replicas 1 --discard new \
          --max-msgs=-1 --max-msg-size=-1 \
          --dupe-window 2m --max-age 168h --max-bytes 2147483648
        nats stream info WOCA_EVENTS >/dev/null 2>&1 || \
        nats stream create WOCA_EVENTS \
          --subjects 'events.>' \
          --storage file --retention limits --replicas 1 --discard old \
          --max-msgs=-1 --max-msg-size=-1 \
          --dupe-window 2m --max-age 24h --max-bytes 5368709120
        echo "woca-dev JetStream streams ready"
    restart: "no"
    networks:
      - woca-mq

  # ─────────────────────────── gateway (L1, edge) ──────────────────────────
  gateway:
    image: nginx:1.29-alpine
    container_name: woca-dev-gateway
    depends_on:
      woca-server-1: { condition: service_started }
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:80/api/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
    restart: unless-stopped
    ports:
      - "${ENT_BUSINESS_PORT:-8080}:80"
      - "${ENT_SKILL_PORT:-9082}:8082"
      - "${ENT_DISCOVERY_PORT:-9083}:8083"
      - "${ENT_CONFIG_PORT:-9086}:8086"
    volumes:
      - ./gateway/nginx-dev.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - woca-edge
      - ladym-data

  # ─────────────────── woca roles (stateless, edge) ──────────────────────
  woca-server-1:
    image: woca-server:local
    container_name: woca-dev-server-1
    build:
      context: ../..
      dockerfile: deploy/selfhosted/Dockerfile.server
    environment:
      WOCA_DB: "postgres://woca:${WOCA_PG_PASSWORD}@woca-pg-primary:5432/woca?sslmode=disable"
      WOCA_AUTH: apikey
      WOCA_RUN_DISPATCH: "queue"
      WOCA_RUNS_OFF_HOST: "true"
      WOCA_SESSION_DIR: "/var/lib/woca/sessions"
      WOCA_HOME: "/var/lib/woca/home"
      # Service-plane gateway listener (v1.5 拓扑拆分): the machine
      # registry (/gw/enroll|renew|heartbeat|resolve/bridges) the edge
      # access point calls home to — internal network only — plus the
      # tenant ops console (v1.7 §6.7): tenants & keys, enrollments,
      # audit. Same console sign-in env as the config console.
      WOCA_GW_ADDR: ":8090"
      WOCA_CONSOLE_USER: ${WOCA_CONSOLE_USER:-}
      WOCA_CONSOLE_PASSWORD: ${WOCA_CONSOLE_PASSWORD:-}
      # Dev posture: certificate-less bridges on by default at startup
      # (production images never set this — R6; not a console knob). The
      # gateway posture is seeded by the SERVER role (it owns the
      # registry), not the config plane.
      WOCA_INSECURE_BRIDGES: "1"
    # Dev only: the tenant ops console (v1.7 §6.7) on the host loopback —
    # tenants & keys, enrollment tokens, bridge inventory, audit. Prod
    # keeps it strictly on the private network.
    ports:
      - "127.0.0.1:${DEV_OPS_PORT:-9091}:8090"
    volumes:
      - woca-sessions:/var/lib/woca/sessions
      - woca-crypto:/var/lib/woca/home
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 15s
    restart: unless-stopped
    depends_on:
      woca-pg-primary: { condition: service_healthy }
    networks:
      - woca-edge
      - woca-pg
      - ladym-data
      - woca-mq

  woca-worker-1:
    image: woca-worker:local
    container_name: woca-dev-worker-1
    build:
      context: ../..
      dockerfile: deploy/selfhosted/Dockerfile.worker
    environment:
      WOCA_DB: "postgres://woca:${WOCA_PG_PASSWORD}@woca-pg-primary:5432/woca?sslmode=disable"
      WOCA_OBS_ADDR: ":9091"
      WOCA_SESSION_DIR: "/var/lib/woca/sessions"
      WOCA_HOME: "/var/lib/woca/home"
    volumes:
      - woca-sessions:/var/lib/woca/sessions
      - woca-crypto:/var/lib/woca/home
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9091/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    depends_on:
      woca-pg-primary: { condition: service_healthy }
    networks:
      - woca-edge
      - woca-pg
      - ladym-data
      - woca-mq

  # Config plane (design §16): settings management + its console (woca
  # settings domains only — tenant/bridge governance lives on the server
  # role's ops console, v1.7) + the config pull (/gw/config) for bridges.
  # The registry routes moved to the service plane (v1.5); the edge
  # forwards.
  woca-config:
    image: woca-config:local
    container_name: woca-dev-config
    build:
      context: ../..
      dockerfile: deploy/selfhosted/Dockerfile.config
    restart: unless-stopped
    depends_on:
      woca-pg-primary: { condition: service_healthy }
    environment:
      WOCA_DB: "postgres://woca:${WOCA_PG_PASSWORD}@woca-pg-primary:5432/woca?sslmode=disable"
      WOCA_OBS_ADDR: ":9093"
      WOCA_HOME: "/var/lib/woca/home"
      # Console sign-in (optional): set BOTH to require username/password
      # login; unset = open console (the dev default).
      WOCA_CONSOLE_USER: ${WOCA_CONSOLE_USER:-}
      WOCA_CONSOLE_PASSWORD: ${WOCA_CONSOLE_PASSWORD:-}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/api/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s
    networks:
      - woca-edge
      - woca-pg
      - woca-mq
    volumes:
      - woca-crypto:/var/lib/woca/home

  # Edge access point (v1.5 拓扑拆分): the stateless public entry the
  # twin's bridge registers through — scenario four in the microservices
  # twin. Plain HTTP is the twin's dev posture (WOCA_EDGE_DEV_HTTP).
  woca-edge:
    image: woca-edge:local
    container_name: woca-dev-edge
    build:
      context: ../..
      dockerfile: deploy/selfhosted/Dockerfile.edge
    restart: unless-stopped
    depends_on:
      woca-server-1: { condition: service_started }
      woca-config: { condition: service_started }
    environment:
      WOCA_SERVICE_URL: http://woca-server-1:8090
      WOCA_CONFIGSVC_URL: http://woca-config:8080
      WOCA_EDGE_ADDR: ":8080"
      WOCA_EDGE_DEV_HTTP: "1"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/api/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
    ports:
      - "${ENT_EDGE_PORT:-8453}:8080"
    networks:
      - woca-edge

  # Admin toolbox: tenant/key commands via `docker exec woca-dev-tenant`
  # (business-plane API keys; the config console itself no longer uses keys).
  woca-tenant:
    image: woca-tenant:local
    container_name: woca-dev-tenant
    build:
      context: ../..
      dockerfile: deploy/selfhosted/Dockerfile.tenant
    restart: unless-stopped
    depends_on:
      woca-pg-primary: { condition: service_healthy }
    environment:
      WOCA_DB: "postgres://woca:${WOCA_PG_PASSWORD}@woca-pg-primary:5432/woca?sslmode=disable"
      WOCA_HOME: "/var/lib/woca/home"
    networks:
      - woca-edge
      - woca-pg
      - woca-mq
    volumes:
      - woca-crypto:/var/lib/woca/home

  # ─────────────── dev bridge (profile: bridge) ────────────────────────────
  # The execution plane as a container with a full dev tool chain
  # (python/node/npm/bun): the browser drives http://localhost:3490, the
  # agent's tool calls execute inside this container, and the control-plane
  # link (enrollment, managed config) reaches woca-config over the compose
  # network. Opt-in via `make dev-bridge` — plain `dev-up` stays minimal.
  bridge:
    image: woca-bridge-dev:local
    container_name: woca-dev-bridge
    profiles: ["bridge"]
    build:
      context: ../..
      dockerfile: deploy/selfhosted/Dockerfile.bridge-dev
    restart: unless-stopped
    ports:
      # The bridge serves the same SPA as woca web (design D1) — open
      # http://localhost:3490 and sign in with a tenant key from the ops
      # console (the bridge itself issues no keys, v1.7).
      - "${DEV_BRIDGE_PORT:-3490}:8080"
    environment:
      WOCA_AUTH: apikey
      WOCA_HOME: /var/lib/woca
      # Control-plane link through the edge access point (v1.5: the bridge
      # sees only the edge). First enrollment under the apikey posture goes
      # through WOCA_ENROLL_TOKEN (from the tenant ops console on the
      # server role), or `docker exec woca-dev-bridge woca-bridge gateway
      # request --url http://woca-edge:8080` for the worker-led flow
      # (approve the fingerprint on the ops console).
      WOCA_EDGE_URL: http://woca-edge:8080
      WOCA_ENROLL_TOKEN: ${DEV_ENROLL_TOKEN:-}
      WOCA_SESSION_DIR: /var/lib/woca/sessions
      # Folder-browser jail: the workspace first, home as a fallback root.
      WOCA_FS_ROOTS: /workspace:/root
    volumes:
      - woca-bridge-home:/var/lib/woca
      - woca-bridge-workspace:/workspace
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null http://127.0.0.1:8080/api/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s
    networks:
      - woca-edge
      # Data-plane reachability for the config-delivered storage/memory
      # domain (checkpoint/memory postgres + the remote ladyM service):
      # the coordinates the config console delivers must resolve from the
      # bridge. Control-plane traffic still goes through the edge only.
      - woca-pg
      - ladym-data

  # ─────────────────── ladyM (minimal: one api + worker) ──────────────────
  ladym-pg:
    image: pgvector/pgvector:pg17
    container_name: woca-dev-ladym-pg
    environment:
      POSTGRES_USER: ladym
      POSTGRES_PASSWORD: ${LADYM_PG_PASSWORD:?set in .env}
      POSTGRES_DB: ladym
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ladym"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    volumes:
      - ladym-pg-data:/var/lib/postgresql/data
    networks:
      - ladym-data

  ladym-api:
    image: ladym-enterprise:local
    container_name: woca-dev-ladym-api
    depends_on:
      ladym-pg: { condition: service_healthy }
    environment:
      LADYM_STORE_BACKEND: postgres
      LADYM_STORE_DSN: "postgres://ladym:${LADYM_PG_PASSWORD}@ladym-pg:5432/ladym"
    restart: unless-stopped
    networks:
      - ladym-data

  ladym-worker:
    image: ladym-enterprise:local
    container_name: woca-dev-ladym-worker
    depends_on:
      ladym-pg: { condition: service_healthy }
    environment:
      LADYM_STORE_BACKEND: postgres
      LADYM_STORE_DSN: "postgres://ladym:${LADYM_PG_PASSWORD}@ladym-pg:5432/ladym"
    command: ["worker"]
    restart: unless-stopped
    networks:
      - ladym-data

networks:
  # Distinct names + subnets from full (172.28.x): a stale full container
  # cannot silently collide with dev networking.
  woca-edge:
    name: woca-dev-edge
    ipam:
      config: [{ subnet: 172.28.130.0/24 }]
  woca-pg:
    name: woca-dev-pg
    ipam:
      config: [{ subnet: 172.28.110.0/24 }]
  woca-mq:
    name: woca-dev-mq
    ipam:
      config: [{ subnet: 172.28.120.0/24 }]
  ladym-data:
    name: woca-dev-ladym
    ipam:
      config: [{ subnet: 172.29.110.0/24 }]

volumes:
  woca-sessions:
    name: woca-dev-sessions
  woca-bridge-home:
    name: woca-dev-bridge-home
  woca-bridge-workspace:
    name: woca-dev-bridge-workspace
  woca-crypto:
    name: woca-dev-crypto
  woca-pg-primary-data:
    name: woca-dev-pg
  nats-js-1-data:
    name: woca-dev-nats
  ladym-pg-data:
    name: woca-dev-ladym-pg
