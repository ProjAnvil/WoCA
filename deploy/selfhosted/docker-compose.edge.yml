# woca control-plane dev group (product design v1.5 §6.3): the edge
# access point and the private core in ONE docker container group, with
# compose network layering standing in for the DMZ — the `public` network
# carries only edge traffic, `internal` is the private core. That is the
# whole topology; prod merely spreads the same split across real network
# zones (edge in the DMZ / a VPS, core on the private LAN).
#
#   public  (published to the host)  ── only edge
#   internal (isolated)              ── edge + config + server + pg
#
# Dev posture notes (deliberate deviations, all commented at the site):
#   * edge speaks plain HTTP (WOCA_EDGE_DEV_HTTP=1) — prod terminates TLS;
#   * the tenant ops console (server :8090) is published on 127.0.0.1:9091
#     and the config console on 127.0.0.1:9086 so the operator can mint
#     credentials and tune settings — prod keeps consoles strictly
#     internal (v1.7 §6.7: the ops console is the sole management entry);
#   * no NATS/ladyM: this group hosts the machine registry and managed
#     settings only (the microservices dev twin covers the full plane).
#
# First-run flow (§6.3 dev 首启):
#   make edge-up
#   → open http://127.0.0.1:9091 (tenant ops console; open by default —
#     set WOCA_CONSOLE_USER/WOCA_CONSOLE_PASSWORD below for a sign-in gate)
#     → bridge 注册 → issue enrollment token
#     → 租户与 key → issue a tenant key (users sign in with it)
#   → start the bridge group: make edge-bridge (with EDGE_ENROLL_TOKEN)
#   → registered; browse https-less dev via http://127.0.0.1:8443 (edge)
#     and sign in with the tenant key
#
# Lifecycle: `make edge-up` / `make edge-down`.

name: woca-edge-dev

services:
  # ─────────────────────── PostgreSQL (private core) ───────────────────────
  pg:
    image: postgres:16-alpine
    container_name: woca-edge-dev-pg
    environment:
      POSTGRES_USER: woca
      POSTGRES_PASSWORD: ${WOCA_PG_PASSWORD:?set in .env}
      POSTGRES_DB: woca
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U woca -d woca"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    volumes:
      - edge-pg-data:/var/lib/postgresql/data
    networks: [internal]

  # ─────────────────────── service plane: woca-server ──────────────────────
  # The machine registry rides its own listener (:8090, WOCA_GW_ADDR) on
  # the internal network: enrollment, renewal, heartbeats, /gw/resolve —
  # the routes the edge calls home on (R7). The same listener hosts the
  # tenant ops console (v1.7 §6.7): tenants & keys, enrollments, the
  # bridge inventory, governance audit. The edge only ever forwards
  # enumerated /gw/* machine routes — the console never exposes through it.
  server:
    image: woca-server:edge-dev
    container_name: woca-edge-dev-server
    build:
      context: ../../build/dist
      dockerfile: Dockerfile
      args:
        ROLE_PKG: woca-server.tar.gz
    command: ["serve", "--addr", ":8080", "--auth", "apikey"]
    environment:
      WOCA_DB: "postgres://woca:${WOCA_PG_PASSWORD}@pg:5432/woca?sslmode=disable"
      WOCA_NACOS_URL: "http://nacos:8848"
      WOCA_AUTH: apikey
      WOCA_GW_ADDR: ":8090"
      WOCA_SESSION_DIR: /var/lib/woca/sessions
      WOCA_HOME: /var/lib/woca/home
      WOCA_OBS_ADDR: "off"
      # Console sign-in (optional): set BOTH to require username/password
      # login on the ops console; unset = open console (the dev default).
      WOCA_CONSOLE_USER: ${WOCA_CONSOLE_USER:-}
      WOCA_CONSOLE_PASSWORD: ${WOCA_CONSOLE_PASSWORD:-}
      # Dev posture: certificate-less bridges on by default at startup
      # (production images never set this — R6; not a console knob).
      WOCA_INSECURE_BRIDGES: "1"
    volumes:
      - edge-sessions:/var/lib/woca/sessions
      - edge-crypto:/var/lib/woca/home
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 15s
    restart: unless-stopped
    depends_on:
      pg: { condition: service_healthy }
      nacos-init: { condition: service_completed_successfully }
    networks: [internal]

  # ─────────────────── ops console facade: woca-ops ───────────────────
  # The console UI as its own service (v1.7 §6.7, split): the SPA plus a
  # stateless proxy onto the server's pageless management API (:8090,
  # internal only). Login and the console session live server-side.
  ops:
    image: woca-ops:edge-dev
    container_name: woca-edge-dev-ops
    build:
      context: ../../build/dist
      dockerfile: Dockerfile
      args:
        ROLE_PKG: woca-ops.tar.gz
    environment:
      WOCA_OPS_ADDR: ":8091"
      WOCA_OPS_UPSTREAM: "http://server:8090"
    restart: unless-stopped
    depends_on:
      - server
    networks: [internal]
    # Dev only: the ops console on the host loopback so the operator can
    # mint enrollment tokens and tenant keys. Prod keeps this strictly on the
    # private network.
    ports:
      - "127.0.0.1:${EDGE_OPS_PORT:-9091}:8091"

  # ─────────────────────── config plane: woca-config ───────────────────────
  # The managed-settings authority + ops console + the /gw/config pull.
  config:
    image: woca-config:edge-dev
    container_name: woca-edge-dev-config
    build:
      context: ../../build/dist
      dockerfile: Dockerfile
      args:
        ROLE_PKG: woca-config.tar.gz
    command: ["--addr", ":8080"]
    environment:
      WOCA_DB: "postgres://woca:${WOCA_PG_PASSWORD}@pg:5432/woca?sslmode=disable"
      WOCA_NACOS_URL: "http://nacos:8848"
      WOCA_OBS_ADDR: "off"
      # Secrets master key lives in WOCA_HOME — shared with the server
      # role over the edge-crypto volume: both planes encrypt rows in the
      # same database, so they must share one secret.key.
      WOCA_HOME: /var/lib/woca/home
      # Console sign-in (optional): set BOTH to require username/password
      # login on :9086; unset = open console (the dev default).
      WOCA_CONSOLE_USER: ${WOCA_CONSOLE_USER:-}
      WOCA_CONSOLE_PASSWORD: ${WOCA_CONSOLE_PASSWORD:-}
    volumes:
      - edge-crypto:/var/lib/woca/home
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/api/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    depends_on:
      pg: { condition: service_healthy }
      nacos-init: { condition: service_completed_successfully }
    networks: [internal]
    # Dev only: the config console on the host loopback (woca settings
    # domains: models, storage, memory, dispatch — v1.7 keeps tenant and
    # bridge governance on the ops console). Prod keeps it internal.
    ports:
      - "127.0.0.1:${EDGE_CONFIG_PORT:-9086}:8080"

  # Admin toolbox for business-plane API keys (`docker compose ... exec
  # tenant woca-tenant tenant …`). Human tenant management is the tenant
  # ops console on :9090 (127.0.0.1:9091) — tenant credentials, not these
  # keys.
  tenant:
    image: woca-tenant:edge-dev
    container_name: woca-edge-dev-tenant
    build:
      context: ../../build/dist
      dockerfile: Dockerfile
      args:
        ROLE_PKG: woca-tenant.tar.gz
    entrypoint: ["sh", "-c", "echo 'woca-tenant: use docker exec to run commands' && sleep infinity"]
    environment:
      WOCA_DB: "postgres://woca:${WOCA_PG_PASSWORD}@pg:5432/woca?sslmode=disable"
      WOCA_HOME: /var/lib/woca/home
    volumes:
      - edge-crypto:/var/lib/woca/home
    restart: "no"
    networks: [internal]

  # ─────────────────────── edge access point (public) ──────────────────────
  # The group's ONLY published port. Stateless (R7): no volumes, no DB —
  # token checks call home to server:8090, config pulls forward to
  # config:8080, client traffic parks until a bridge tunnel picks it up.
  edge:
    image: woca-edge:edge-dev
    container_name: woca-edge-dev-edge
    build:
      context: ../../build/dist
      dockerfile: Dockerfile
      args:
        ROLE_PKG: woca-edge.tar.gz
    command: ["--addr", ":8080"]
    environment:
      WOCA_NACOS_URL: "http://nacos:8848"
      WOCA_SERVICE_URL: http://server:8090
      WOCA_CONFIGSVC_URL: http://config:8080
      WOCA_EDGE_ADDR: ":8080"
      # Dev posture: plain HTTP on the published port. Prod terminates
      # TLS here (WOCA_TLS_CERT/KEY) or fronts with a real edge (CF
      # Tunnel / Tailscale Funnel — design §5.4 接入点的两种来源).
      WOCA_EDGE_DEV_HTTP: "1"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/api/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    depends_on:
      server: { condition: service_started }
      config: { condition: service_started }
      nacos-init: { condition: service_completed_successfully }
    ports:
      - "${EDGE_PUBLIC_PORT:-8443}:8080"
    networks: [public, internal]

  # ─────────────────── nacos: discovery + config delivery ────────────────
  # Same posture as the full stack: service addresses and the delivered
  # configuration pack ride the registry. Roles refuse to start without
  # it (fail-closed).
  nacos:
    image: nacos/nacos-server:v2.4.3
    container_name: woca-edge-dev-nacos
    environment:
      MODE: standalone
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8848/nacos/v1/console/health/readiness || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s
    restart: unless-stopped
    networks: [internal]

  nacos-init:
    image: curlimages/curl:8.10.1
    container_name: woca-edge-dev-nacos-init
    depends_on:
      nacos: { condition: service_healthy }
    environment:
      WOCA_PG_PASSWORD: ${WOCA_PG_PASSWORD:?set in .env}
    entrypoint:
      - /bin/sh
      - -ec
      - |
        publish() {  # dataId content
          curl -sf -X POST "http://nacos:8848/nacos/v1/cs/configs" \
            --data-urlencode "dataId=$$1" \
            --data-urlencode "group=DEFAULT_GROUP" \
            --data-urlencode "content=$$2"
          i=0
          until [ "$$(curl -sf "http://nacos:8848/nacos/v1/cs/configs?dataId=$$1&group=DEFAULT_GROUP")" = "$$2" ]; do
            i=$$((i+1)); [ $$i -gt 30 ] && { echo "nacos read-back of $$1 never settled"; exit 1; }
            sleep 1
          done
          echo "published $$1"
        }
        publish woca-db.dsn "postgres://woca:$${WOCA_PG_PASSWORD}@pg:5432/woca?sslmode=disable"
        publish woca-ops.upstream "http://server:8090"
        publish woca-config.pack '{"version":1,"generation":"","settings":{}}'
        echo "nacos entries ready"
    restart: "no"
    networks: [internal]

networks:
  public:
    name: woca-edge-dev-public
  internal:
    name: woca-edge-dev-internal
    internal: true

volumes:
  edge-pg-data:
    name: woca-edge-dev-pg
  edge-sessions:
    name: woca-edge-dev-sessions
  edge-crypto:
    name: woca-edge-dev-crypto
