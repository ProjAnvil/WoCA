# netlab enterprise topology — the private-cloud edge chain (接入点)
# across docker network isolation. TEST topology (design
# docs/superpowers/specs/2026-10-06-netlab-design.md): the network layer
# plus only its fail-closed dependencies (pg + nacos for the server/
# config/edge roles). No ops/tenant/worker roles — enrollment and user
# keys are minted headlessly over the server's open-console management
# API (:8090), so what remains under test is purely the network plane.
#
#   front (public)      wan (edge↔remote site)     core (private, internal)
#  ┌────────┐     ┌──────────┐     ┌─────────┐    ┌────────┐ ┌────────┐ ┌──────┐ ┌───────┐
#  │ client │────▶│   edge   │────▶│ bridge  │    │ server │ │ config │ │ pg   │ │ nacos │
#  │ (curl) │     │woca-edge │     │woca-br. │    │ :8080  │ │ :8080  │ └──────┘ └───────┘
#  └────────┘     │  :8080   │     │ :8080   │    │GW :8090│ └────────┘
#  外网浏览器替身    └──────────┘     └─────────┘    └────────┘
#                  tri-homed        wan only        core only
#
# Isolation semantics under test: the client shares ONLY front with the
# edge; the bridge shares ONLY wan with the edge (its single control
# plane peer — it must not reach the core by address); the core is an
# internal docker network with no outside egress at all. Browser traffic
# parks at the edge until the bridge's outbound tunnel picks it up.
#
# Dev posture (mirrors deploy/selfhosted/docker-compose.edge.yml): plain
# HTTP edge (WOCA_EDGE_DEV_HTTP), insecure bridges (no SPKI cert pin),
# WOCA_EDGE_INSECURE on the bridge for the http:// edge URL. TLS and the
# enrollment pin policy are out of netlab scope.
#
# Two-phase bring-up (enroll token minted at the core first):
#   docker compose up -d --build server config edge client
#   docker compose exec -T server wget -qO- --post-data='' http://127.0.0.1:8090/api/gw/enrollments
#   NETLAB_ENROLL_TOKEN=woca_enroll_... docker compose up -d --build bridge

name: woca-netlab-ee

services:
  pg:
    image: postgres:16-alpine
    container_name: woca-netlab-ee-pg
    environment:
      POSTGRES_USER: woca
      POSTGRES_PASSWORD: ${WOCA_PG_PASSWORD:-netlab-pg}
      POSTGRES_DB: woca
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U woca -d woca"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - pg-data:/var/lib/postgresql/data
    networks: [core]

  nacos:
    image: nacos/nacos-server:v2.4.3
    container_name: woca-netlab-ee-nacos
    environment:
      MODE: standalone
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8848/nacos/v1/console/health/readiness || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s
    networks: [core]

  nacos-init:
    image: curlimages/curl:8.10.1
    container_name: woca-netlab-ee-nacos-init
    depends_on:
      nacos: { condition: service_healthy }
    environment:
      WOCA_PG_PASSWORD: ${WOCA_PG_PASSWORD:-netlab-pg}
    entrypoint:
      - /bin/sh
      - -ec
      - |
        publish() {
          curl -sf -X POST "http://nacos:8848/nacos/v1/cs/configs" \
            --data-urlencode "dataId=$$1" \
            --data-urlencode "group=DEFAULT_GROUP" \
            --data-urlencode "content=$$2"
          i=0
          until [ "$$(curl -sf "http://nacos:8848/nacos/v1/cs/configs?dataId=$$1&group=DEFAULT_GROUP")" = "$$2" ]; do
            i=$$((i+1)); [ $$i -gt 30 ] && { echo "nacos read-back of $$1 never settled"; exit 1; }
            sleep 1
          done
          echo "published $$1"
        }
        publish woca-db.dsn "postgres://woca:$${WOCA_PG_PASSWORD}@pg:5432/woca?sslmode=disable"
        publish woca-config.pack '{"version":2,"generation":"","settings":{}}'
        echo "nacos entries ready"
    restart: "no"
    networks: [core]

  server:
    image: woca-server:netlab
    build:
      context: ../../build/dist
      dockerfile: Dockerfile
      args:
        ROLE_PKG: woca-server.tar.gz
    container_name: woca-netlab-ee-server
    command: ["serve", "--addr", ":8080", "--auth", "apikey"]
    environment:
      WOCA_DB: "postgres://woca:${WOCA_PG_PASSWORD:-netlab-pg}@pg:5432/woca?sslmode=disable"
      WOCA_NACOS_URL: "http://nacos:8848"
      WOCA_AUTH: apikey
      WOCA_GW_ADDR: ":8090"
      WOCA_SESSION_DIR: /var/lib/woca/sessions
      WOCA_HOME: /var/lib/woca/home
      WOCA_OBS_ADDR: "off"
      WOCA_INSECURE_BRIDGES: "1"
    volumes:
      - sessions:/var/lib/woca/sessions
      - crypto:/var/lib/woca/home
    restart: unless-stopped
    depends_on:
      pg: { condition: service_healthy }
      nacos-init: { condition: service_completed_successfully }
    networks: [core]

  config:
    image: woca-config:netlab
    build:
      context: ../../build/dist
      dockerfile: Dockerfile
      args:
        ROLE_PKG: woca-config.tar.gz
    container_name: woca-netlab-ee-config
    command: ["--addr", ":8080"]
    environment:
      WOCA_DB: "postgres://woca:${WOCA_PG_PASSWORD:-netlab-pg}@pg:5432/woca?sslmode=disable"
      WOCA_NACOS_URL: "http://nacos:8848"
      WOCA_OBS_ADDR: "off"
      WOCA_HOME: /var/lib/woca/home
    volumes:
      - crypto:/var/lib/woca/home
    restart: unless-stopped
    depends_on:
      pg: { condition: service_healthy }
      nacos-init: { condition: service_completed_successfully }
    networks: [core]

  edge:
    image: woca-edge:netlab
    build:
      context: ../../build/dist
      dockerfile: Dockerfile
      args:
        ROLE_PKG: woca-edge.tar.gz
    container_name: woca-netlab-ee-edge
    command: ["--addr", ":8080"]
    environment:
      WOCA_NACOS_URL: "http://nacos:8848"
      WOCA_SERVICE_URL: http://server:8090
      WOCA_CONFIGSVC_URL: http://config:8080
      WOCA_EDGE_ADDR: ":8080"
      WOCA_EDGE_DEV_HTTP: "1"
    restart: unless-stopped
    depends_on:
      server: { condition: service_started }
      config: { condition: service_started }
      nacos-init: { condition: service_completed_successfully }
    networks: [front, wan, core]

  bridge:
    image: woca-bridge:netlab
    build:
      context: ../../build/dist
      dockerfile: Dockerfile
      args:
        ROLE_PKG: woca-bridge.tar.gz
    container_name: woca-netlab-ee-bridge
    command: ["serve", "--addr", "0.0.0.0:8080", "--auth", "apikey"]
    environment:
      WOCA_AUTH: apikey
      WOCA_HOME: /var/lib/woca
      WOCA_SESSION_DIR: /var/lib/woca/sessions
      # Outbound-only control-plane link: the bridge sees exactly one
      # peer (the edge) over the simulated internet (wan).
      WOCA_EDGE_URL: http://edge:8080
      WOCA_ENROLL_TOKEN: ${NETLAB_ENROLL_TOKEN:-}
      WOCA_EDGE_INSECURE: "1"
      WOCA_FS_ROOTS: /workspace
    volumes:
      - bridge-home:/var/lib/woca
      - bridge-workspace:/workspace
    restart: unless-stopped
    depends_on:
      edge: { condition: service_started }
    networks: [wan]

  client:
    image: curlimages/curl:8.10.1
    container_name: woca-netlab-ee-client
    entrypoint: ["sleep", "infinity"]
    networks: [front]

networks:
  front:
    name: woca-netlab-ee-front
  wan:
    name: woca-netlab-ee-wan
  core:
    name: woca-netlab-ee-core
    internal: true

volumes:
  pg-data:
    name: woca-netlab-ee-pg
  sessions:
    name: woca-netlab-ee-sessions
  crypto:
    name: woca-netlab-ee-crypto
  bridge-home:
    name: woca-netlab-ee-bridge-home
  bridge-workspace:
    name: woca-netlab-ee-bridge-workspace
