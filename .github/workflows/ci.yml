name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          # The wocadb lgcp test (internal/wocadb/rls_lgcp_test.go) rewrites
          # "://woca:woca-enterprise-dev@" and "/woca?" in the DSN verbatim,
          # so the service must provision exactly this user/password/database.
          POSTGRES_USER: woca
          POSTGRES_PASSWORD: woca-enterprise-dev
          POSTGRES_DB: woca
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U woca" --health-interval 5s --health-retries 10
    env:
      # Both PG-gated suites create and drop their own databases/roles on the
      # target instance; the DSNs only need to reach any database as a
      # superuser (rls_pg_test.go rewrites user/db per test).
      WOCA_TEST_PG_DSN: postgres://woca:woca-enterprise-dev@localhost:5432/woca?sslmode=disable
      WOCA_PG_TEST_DSN: postgres://woca:woca-enterprise-dev@localhost:5432/woca?sslmode=disable
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      # The enterprise console SPAs are gitignored, so the embedded spa
      # dirs only contain a .gitkeep here; build the real consoles before
      # compiling (tests assert on the embedded SPA content).
      - uses: oven-sh/setup-bun@v2

      - name: Build enterprise console SPAs
        run: make ee-web

      - name: Check gofmt
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          # Pin to the version .golangci.yml was verified with (v2 schema).
          version: v2.12.2

      - name: SSE event contract drift check
        run: ci/check-sse-contract.sh

      - name: Test
        run: go test ./...

      - name: Test with race detector
        run: go test -race ./...

      - name: Edition boundaries and dependency hygiene
        run: make check-deps check-server-artifacts check-editions

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: web tests
        run: cd web && bun install --frozen-lockfile && bun run test
      - name: ee console tests
        run: |
          for d in ee/configsvc-web ee/opsconsole-web ee/skillsvc-web; do
            (cd "$d" && bun install --frozen-lockfile && bun run test) || exit 1
          done

  # Browser E2E over the five frontend forms (e2e/README.md): the same
  # `make e2e` a developer runs, against the real binaries.
  #
  # Runs on every push/PR like the other jobs. `cmd/woca` and `e2e/lab` do not
  # import the enterprise console SPAs, so — unlike the `test` job — this one
  # does not need `make ee-web`.
  e2e:
    runs-on: ubuntu-latest
    # Bounded: a hung lab topology would otherwise sit on the runner until the
    # job's default six hours.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - uses: oven-sh/setup-bun@v2

      # --with-deps differs from `make e2e-install` on purpose: it also pulls
      # the system libraries headless Chromium needs, which requires sudo
      # (passwordless on runners).
      - name: Install Playwright and Chromium
        run: cd e2e && bun install --frozen-lockfile && npx playwright install --with-deps chromium

      # `make e2e` depends on `web`: the woca binary embeds web/dist, so the
      # frontend has to be built before Playwright compiles the binary.
      - name: Run the browser E2E suite
        run: make e2e

      # Kept even on success: the report is the cheapest way to see which of
      # the five forms a failure belongs to, and ARIA snapshots of failed
      # steps only exist in test-results.
      - name: Upload the Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7

  native:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      # The whole module is pure Go for test purposes (wails build only needs
      # cgo/webkit at app build time); `go test ./...` passes on macOS as-is.
      - run: cd native-client && go test ./...
