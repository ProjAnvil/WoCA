version: "2"

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck # in v2 staticcheck subsumes gosimple
    - unused
  settings:
    errcheck:
      exclude-functions:
        # CLI tools print to stdout/stderr as best-effort user output; a
        # failed print is unactionable and checking it clutters every call.
        - fmt.Fprint
        - fmt.Fprintln
        - fmt.Fprintf
  exclusions:
    rules:
      # Tests deliberately ignore close/write errors on throwaway resources
      # (httptest servers, temp files, pipes); checking them adds noise, not safety.
      - linters: [errcheck]
        path: _test\.go$
      # QF1xxx are staticcheck "quickfix" style hints (De Morgan, tagged
      # switches, ...), not correctness issues; keep the signal checks on.
      - linters: [staticcheck]
        text: "^QF1"
    paths:
      - web/wailsjs # generated by wails
      - node_modules
      - native-client # separate Go module with its own lint scope

formatters:
  enable:
    - gofmt
    - goimports

run:
  timeout: 5m
  # Cap the language version so binaries built with an older Go toolchain
  # (e.g. Homebrew golangci-lint built with go1.26) can type-check code on
  # systems where the local `go` is newer.
  go: "1.26"

issues:
  # Report every finding: the default caps (3 identical messages, 50 per
  # linter) silently drop issues and make results nondeterministic.
  max-same-issues: 0
  max-issues-per-linter: 0
