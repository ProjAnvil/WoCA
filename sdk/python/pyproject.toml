[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "woca-agent-sdk"
version = "0.1.0"
description = "Python SDK for the woca agent harness (drives woca -p --output-format stream-json)"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]
